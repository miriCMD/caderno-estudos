<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2550">
<title>Caderno de Estudos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📒</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F8FC; --grid:#E4EAF5; --card:#FFFFFF; --ink:#1B2550; --ink2:#525C80; --ink3:#8A92AE;
  --line:#D8DFEC; --hl:#FFE45C; --hl2:#FFF3A8; --ok:#1F9D6B; --warn:#D9822B; --bad:#C8364A;
  --h0:#E9EEF7; --h1:#C9D8F5; --h2:#94B2EC; --h3:#5580DA; --h4:#2B4FB0; --h5:#16307A;
  --shadow:0 1px 0 rgba(27,37,80,.06), 0 6px 18px -10px rgba(27,37,80,.25);
  --r-lg:18px; --r-md:12px; --r-sm:8px;
  --f-ui:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-hand:"Caveat", "Comic Sans MS", cursive;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1430; --grid:#161E42; --card:#151D3F; --ink:#E7EBF8; --ink2:#AEB6D6; --ink3:#7580A8;
    --line:#26305A; --hl:#F5D93A; --hl2:#3D3A1F;
    --h0:#1A2349; --h1:#23386F; --h2:#2F55A6; --h3:#4679D6; --h4:#79A2F0; --h5:#B9CFFF;
    --shadow:0 1px 0 rgba(0,0,0,.2), 0 8px 22px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --paper:#0E1430; --grid:#161E42; --card:#151D3F; --ink:#E7EBF8; --ink2:#AEB6D6; --ink3:#7580A8;
  --line:#26305A; --hl:#F5D93A; --hl2:#3D3A1F;
  --h0:#1A2349; --h1:#23386F; --h2:#2F55A6; --h3:#4679D6; --h4:#79A2F0; --h5:#B9CFFF;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 8px 22px -12px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.5;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:26px 26px; background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--f-ui); line-height:1.15; margin:0 0 .5em; letter-spacing:-.01em}
h1{font-size:2rem; font-weight:800} h2{font-size:1.45rem; font-weight:800} h3{font-size:1.1rem; font-weight:600}
p{margin:0 0 .8em}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--h3); outline-offset:2px; border-radius:6px}
img{max-width:100%}
.muted{color:var(--ink2)} .small{font-size:.85rem} .tiny{font-size:.75rem}
.hide{display:none!important}

/* ---------- Botões e campos ---------- */
.btn{display:inline-flex; align-items:center; gap:.45em; border:1.5px solid var(--ink); background:var(--card); color:var(--ink);
  padding:.55em 1em; border-radius:999px; font-family:var(--f-ui); font-weight:600; font-size:.95rem; transition:transform .08s, background .15s; text-decoration:none}
.btn:hover{background:var(--hl2)} .btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink); color:var(--paper)} .btn.primary:hover{background:var(--h4); border-color:var(--h4)}
.btn.ghost{border-color:var(--line)} .btn.danger{border-color:var(--bad); color:var(--bad)}
.btn.sm{padding:.3em .75em; font-size:.85rem}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.field{display:flex; flex-direction:column; gap:.3em; margin-bottom:.9em}
.field label{font-family:var(--f-ui); font-weight:600; font-size:.9rem}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{
  width:100%; border:1.5px solid var(--line); background:var(--card); border-radius:var(--r-sm); padding:.55em .7em}
input:focus,select:focus,textarea:focus{border-color:var(--h3); outline:none}
textarea{min-height:110px; resize:vertical}
.row{display:flex; gap:.6em; align-items:center; flex-wrap:wrap}
.spacer{flex:1}

/* ---------- Tela de senha ---------- */
#lock{min-height:100%; display:grid; place-items:center; padding:24px}
.lockcard{background:var(--card); border:1.5px solid var(--line); border-radius:24px; padding:34px 30px; width:min(400px,100%); box-shadow:var(--shadow); text-align:center}
.lockcard .avatar{width:92px; height:92px; margin:0 auto 12px}
.lockcard .hand{font-family:var(--f-hand); font-size:2.3rem; line-height:1; margin-bottom:.2em}
.lockcard form{margin-top:18px; text-align:left}
.err{color:var(--bad); font-size:.9rem; min-height:1.3em}

/* ---------- Avatar ---------- */
.avatar{border-radius:50%; background:var(--hl); display:grid; place-items:center; overflow:hidden; font-family:var(--f-ui); font-weight:800; color:#1B2550; flex:none; border:2px solid var(--ink)}
.avatar img{width:100%; height:100%; object-fit:cover}

/* ---------- Layout ---------- */
#app{display:grid; grid-template-columns:236px 1fr; min-height:100%}
.side{position:sticky; top:0; height:100vh; height:100dvh; padding:22px 16px; border-right:1.5px solid var(--line); background:color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter:blur(6px); display:flex; flex-direction:column; gap:18px}
.brand{font-family:var(--f-ui); font-weight:800; font-size:1.15rem; display:flex; align-items:center; gap:.4em; padding:0 6px}
.me{display:flex; gap:10px; align-items:center; padding:10px; border-radius:var(--r-md); background:var(--card); border:1.5px solid var(--line)}
.me .avatar{width:42px; height:42px; font-size:1.1rem}
.me b{font-family:var(--f-ui); display:block; line-height:1.1}
nav.menu{display:flex; flex-direction:column; gap:2px}
nav.menu a{display:flex; gap:.6em; align-items:center; text-decoration:none; color:var(--ink2); font-family:var(--f-ui); font-weight:600; padding:.55em .7em; border-radius:10px}
nav.menu a:hover{color:var(--ink); background:var(--card)}
nav.menu a.on{color:#1B2550; background:var(--hl)}
nav.menu .ic{width:1.3em; text-align:center}
.sync{margin-top:auto; font-size:.78rem; color:var(--ink3); padding:0 6px; display:flex; align-items:center; gap:.4em}
.sync i{width:8px; height:8px; border-radius:50%; background:var(--ok); display:inline-block}
.sync.saving i{background:var(--warn)} .sync.error i{background:var(--bad)}
main{padding:28px clamp(16px,4vw,44px) 90px; max-width:1180px; width:100%}
.view-head{display:flex; align-items:end; gap:1em; flex-wrap:wrap; margin-bottom:18px}
.view-head h1{margin:0}

@media (max-width:860px){
  #app{grid-template-columns:1fr}
  .side{position:fixed; top:auto; bottom:0; left:0; right:0; height:auto; z-index:40; flex-direction:row; padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px)); border-right:0; border-top:1.5px solid var(--line); gap:0}
  .brand,.me,.sync{display:none}
  nav.menu{flex-direction:row; width:100%; justify-content:space-around}
  nav.menu a{flex-direction:column; gap:0; font-size:.66rem; padding:.35em .15em; text-align:center}
  nav.menu a .ic{font-size:1.25rem}
  nav.menu a.on{background:var(--hl2)}
  main{padding-bottom:110px}
  h1{font-size:1.6rem}
}

/* ---------- Cartões ---------- */
.card{background:var(--card); border:1.5px solid var(--line); border-radius:var(--r-lg); padding:18px 20px; box-shadow:var(--shadow)}
.card h3{display:flex; align-items:center; gap:.5em}
.grid{display:grid; gap:16px}
.g-home{grid-template-columns:1.25fr 1fr}
.g-2{grid-template-columns:1fr 1fr}
@media (max-width:980px){.g-home,.g-2{grid-template-columns:1fr}}

/* ---------- Saudação ---------- */
.hello{display:flex; gap:18px; align-items:center; margin-bottom:22px}
.hello .avatar{width:74px; height:74px; font-size:1.8rem}
.hello .hand{font-family:var(--f-hand); font-size:clamp(2.1rem,5vw,3rem); line-height:.95; font-weight:700}
.hello .phrase{font-family:var(--f-hand); font-size:1.45rem; color:var(--ink2); line-height:1.15; margin-top:4px}
.countdowns{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px}
.cd{display:flex; align-items:baseline; gap:.45em; padding:.45em .9em; border-radius:999px; border:1.5px solid var(--line); background:var(--card); font-family:var(--f-ui)}
.cd b{font-size:1.25rem; font-weight:800}
.cd.soon{border-color:var(--ink); background:var(--hl2)}

/* ---------- Cronômetro ---------- */
.timer{position:relative; overflow:hidden}
.timer .clock{font-family:var(--f-ui); font-weight:800; font-size:clamp(3rem,9vw,4.8rem); letter-spacing:-.02em; line-height:1; margin:.25em 0 .2em; font-variant-numeric:tabular-nums}
.timer .subjline{display:flex; align-items:center; gap:.5em; font-family:var(--f-ui); font-weight:600}
.timer .state{font-size:.85rem; color:var(--ink2)}
.timer.running .clock{color:var(--ink)}
.timer.paused .clock{color:var(--ink3)}
.timer .bar{position:absolute; left:0; bottom:0; height:6px; background:var(--subj, var(--h3)); transition:width 1s linear}
.segmented{display:inline-flex; border:1.5px solid var(--line); border-radius:999px; overflow:hidden}
.segmented button{border:0; background:transparent; padding:.35em .8em; font-family:var(--f-ui); font-weight:600; font-size:.85rem; color:var(--ink2)}
.segmented button.on{background:var(--ink); color:var(--paper)}
.dot{width:.75em; height:.75em; border-radius:50%; display:inline-block; flex:none; background:var(--c,#999)}

/* ---------- Progresso ---------- */
.prog{height:10px; border-radius:99px; background:var(--h0); overflow:hidden}
.prog>span{display:block; height:100%; background:var(--c, var(--h3)); border-radius:99px}
.stat{font-family:var(--f-ui)} .stat b{display:block; font-size:1.7rem; font-weight:800; line-height:1.1}
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px}

/* ---------- Barras da semana ---------- */
.week{display:grid; grid-template-columns:repeat(7,1fr); gap:8px; align-items:end; height:140px; margin-top:8px}
.week .col{display:flex; flex-direction:column-reverse; height:100%; border-radius:6px; background:var(--h0); overflow:hidden; cursor:pointer}
.week .col span{display:block; width:100%}
.week.lbl{height:auto; align-items:start; text-align:center; font-size:.78rem; color:var(--ink2); margin-top:4px}
.week.lbl b{display:block; color:var(--ink); font-family:var(--f-ui)}

/* ---------- Heatmap ---------- */
.heat-wrap{overflow-x:auto; padding-bottom:6px}
.heat{display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,14px); gap:3px; width:max-content}
.heat .c{width:14px; height:14px; border-radius:3px; background:var(--h0); cursor:pointer}
.heat .c.out{visibility:hidden}
.heat .c.today{outline:2px solid var(--ink); outline-offset:1px}
.l0{background:var(--h0)!important} .l1{background:var(--h1)!important} .l2{background:var(--h2)!important} .l3{background:var(--h3)!important} .l4{background:var(--h4)!important} .l5{background:var(--h5)!important}
.months-lbl{display:grid; grid-auto-flow:column; grid-auto-columns:17px; font-size:.72rem; color:var(--ink2); height:16px; width:max-content}
.heat-row{display:flex; gap:6px}
.heat-days{display:grid; grid-template-rows:repeat(7,14px); gap:3px; font-size:.68rem; color:var(--ink3); padding-top:16px}
.legend{display:flex; align-items:center; gap:4px; font-size:.75rem; color:var(--ink2)}
.legend i{width:13px; height:13px; border-radius:3px; display:inline-block}

/* ---------- Calendário do mês ---------- */
.mcal{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
.mcal .hd{font-family:var(--f-ui); font-weight:600; font-size:.8rem; color:var(--ink2); text-align:center}
.mcal .day{min-height:78px; border:1.5px solid var(--line); border-radius:10px; padding:6px 7px; background:var(--card); cursor:pointer; display:flex; flex-direction:column; gap:4px; text-align:left}
.mcal .day:hover{border-color:var(--ink)}
.mcal .day.empty{visibility:hidden}
.mcal .day.today{border-color:var(--ink); box-shadow:inset 0 -4px 0 var(--hl)}
.mcal .day .n{font-family:var(--f-ui); font-weight:600; font-size:.85rem}
.mcal .day .t{font-family:var(--f-ui); font-weight:800; font-size:.95rem; margin-top:auto}
.mcal .stack{display:flex; height:7px; border-radius:4px; overflow:hidden; background:var(--h0)}
@media (max-width:620px){ .mcal .day{min-height:56px; padding:4px} .mcal .day .t{font-size:.72rem} .mcal .day .n{font-size:.75rem} }

.tip{position:fixed; z-index:90; pointer-events:none; background:var(--ink); color:var(--paper); border-radius:10px; padding:8px 11px; font-size:.82rem; min-width:170px; max-width:260px; box-shadow:0 8px 24px -8px rgba(0,0,0,.5)}
.tip b{font-family:var(--f-ui)}
.tip .r{display:flex; align-items:center; gap:.45em}
.tip .r span:last-child{margin-left:auto; font-variant-numeric:tabular-nums}

.hbar{display:grid; grid-template-columns:minmax(110px,190px) 1fr 58px; gap:10px; align-items:center; margin:6px 0; font-size:.9rem}
.hbar .prog{height:12px}
.hbar .v{text-align:right; font-family:var(--f-ui); font-weight:600; font-variant-numeric:tabular-nums}

/* ---------- Matérias ---------- */
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{border:1.5px solid var(--line); border-radius:999px; padding:.25em .75em; background:var(--card); font-family:var(--f-ui); font-weight:600; font-size:.85rem; color:var(--ink2)}
.chip.on{border-color:var(--ink); color:var(--ink); background:var(--hl2)}
.tag{display:inline-block; font-family:var(--f-ui); font-size:.68rem; font-weight:600; padding:.05em .5em; border-radius:6px; border:1px solid var(--line); color:var(--ink2); margin-left:4px; white-space:nowrap}
.tag.d{border-color:#0EA5E9; color:#0B7FB5} .tag.k{border-color:#16A34A; color:#15803D}
.tag.adj{border-color:var(--warn); color:var(--warn)}
:root[data-theme="dark"] .tag.d{color:#6CCBF5} :root[data-theme="dark"] .tag.k{color:#6EE7A0}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tag.d{color:#6CCBF5} :root:not([data-theme="light"]) .tag.k{color:#6EE7A0} }
.subj{border-left:7px solid var(--c); padding:0}
.subj>summary{list-style:none; cursor:pointer; padding:14px 18px; display:grid; grid-template-columns:1fr auto; gap:6px 14px; align-items:center}
.subj>summary::-webkit-details-marker{display:none}
.subj>summary h3{margin:0}
.subj .meta{font-size:.85rem; color:var(--ink2)}
.subj .body{padding:0 18px 16px}
.topic{display:flex; gap:10px; align-items:flex-start; padding:7px 0; border-top:1px dashed var(--line)}
.topic button.st{width:26px; height:26px; border-radius:7px; border:1.5px solid var(--ink3); background:transparent; flex:none; display:grid; place-items:center; font-size:.85rem; font-weight:700}
.topic button.st.s1{background:var(--c); border-color:var(--c); color:#fff}
.topic button.st.s2{background:var(--ink); border-color:var(--ink); color:var(--paper)}
.topic .tt{flex:1}
.tipbox{background:var(--hl2); border-radius:10px; padding:10px 12px; font-size:.92rem; margin:6px 0 10px}

/* ---------- Semana-modelo ---------- */
.rout{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px}
.rday{background:var(--card); border:1.5px solid var(--line); border-radius:var(--r-md); padding:12px}
.rday.today{border-color:var(--ink); box-shadow:inset 0 5px 0 var(--hl)}
.rday h4{font-family:var(--f-ui); margin:2px 0 10px; display:flex; justify-content:space-between; align-items:baseline; gap:8px}
.rday .empty-day{font-size:.85rem; color:var(--ink3); margin:0 0 10px}
.blk{border-radius:10px; margin-bottom:8px; padding:9px 10px 8px; background:color-mix(in srgb, var(--c) 15%, var(--card)); border-left:4px solid var(--c)}
.blk .nm{display:block; width:100%; text-align:left; border:0; background:transparent; padding:0; font-size:.92rem; line-height:1.3; font-weight:600; color:var(--ink)}
.blk .nm:hover{text-decoration:underline; text-underline-offset:3px}
.blk .ctl{display:flex; align-items:center; gap:4px; margin-top:6px}
.blk .ctl .step{width:28px; height:28px; border-radius:50%; border:1.5px solid color-mix(in srgb, var(--ink) 25%, transparent); background:var(--card); font-weight:700; line-height:1; display:grid; place-items:center; padding:0; color:var(--ink)}
.blk .ctl .step:hover{border-color:var(--ink)}
.blk .ctl .m{min-width:58px; text-align:center; font-family:var(--f-ui); font-weight:800; font-variant-numeric:tabular-nums}
.blk .ctl .x{margin-left:auto; width:28px; height:28px; border-radius:50%; border:0; background:transparent; color:var(--ink2); font-size:1.15rem; line-height:1}
.blk .ctl .x:hover{background:color-mix(in srgb, var(--bad) 14%, transparent); color:var(--bad)}
.avail{display:grid; grid-template-columns:repeat(7,1fr); gap:8px; margin:10px 0 14px}
.avail label{display:flex; flex-direction:column; gap:4px; font-family:var(--f-ui); font-weight:600; font-size:.82rem; text-align:center}
.avail select{padding:.45em .3em; text-align:center}
@media (max-width:700px){ .avail{grid-template-columns:repeat(4,1fr)} }
.notice{display:flex; gap:10px; align-items:center; flex-wrap:wrap; background:var(--hl2); border-radius:10px; padding:10px 12px; margin-top:12px; font-size:.92rem}
.plan-tbl{width:100%; border-collapse:collapse; font-size:.9rem; margin-top:8px}
.plan-tbl td,.plan-tbl th{padding:6px 8px; border-bottom:1px dashed var(--line); text-align:left}
.plan-tbl th{font-family:var(--f-ui); font-weight:600; color:var(--ink2)}
.plan-tbl td.n{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}

/* ---------- Cronograma: dia a dia ---------- */
.wk-ag{margin-bottom:12px}
.wk-ag>summary{list-style:none; cursor:pointer; display:flex; gap:6px 12px; align-items:center; flex-wrap:wrap; padding:11px 16px; background:var(--card); border:1.5px solid var(--line); border-radius:var(--r-md); font-family:var(--f-ui)}
.wk-ag>summary::-webkit-details-marker{display:none}
.wk-ag>summary::before{content:"▸"; color:var(--ink2); transition:transform .15s; display:inline-block}
.wk-ag[open]>summary::before{transform:rotate(90deg)}
.wk-ag[open]>summary{margin-bottom:12px; border-color:var(--ink)}
.wk-ag .wk-t{font-weight:800}
.goals{margin-bottom:12px; padding:12px 16px}
.goal-list{columns:2 280px; column-gap:26px; margin-top:6px}
.goal-list .chk{break-inside:avoid; font-size:.92rem}
.rday.past{opacity:.6}
.rday h4 .dt{color:var(--ink2); font-weight:600; font-size:.85rem; margin-left:.35em}
.ev{font-family:var(--f-ui); font-size:.8rem; font-weight:600; line-height:1.3; padding:6px 9px; border-radius:8px; background:var(--hl2); margin-bottom:8px}
.ev.exam{background:var(--ink); color:var(--paper)}
.blk .bn{font-family:var(--f-ui); font-size:.92rem; font-weight:700}
.ag-t{display:flex; gap:7px; align-items:flex-start; font-size:.84rem; line-height:1.3; color:var(--ink2); margin:5px 0 0; cursor:pointer}
.ag-t input{width:16px; height:16px; margin:.1em 0 0; accent-color:var(--ink); flex:none}
.ag-t.ok span{text-decoration:line-through; color:var(--ink3)}
.blk .go{margin-top:7px; padding:.2em .75em; font-size:.8rem}
.task{font-size:.9rem; padding:3px 0}
.cov{padding:12px 0; border-top:1px dashed var(--line)}
.cov.first{border-top:0; padding-top:2px}
.ed-row{display:flex; gap:8px; align-items:center; margin-bottom:8px}
.ed-row select{flex:1; min-width:0}
.ed-row input[type=number]{width:86px; flex:none}
.ed-row input[type=text]{flex:1}
.xbtn{width:32px; height:32px; border-radius:50%; border:0; background:transparent; color:var(--ink2); font-size:1.25rem; line-height:1; flex:none}
.xbtn:hover{background:color-mix(in srgb, var(--bad) 14%, transparent); color:var(--bad)}
.up{display:grid; grid-template-columns:62px 1fr; gap:10px; padding:8px 0; border-bottom:1px dashed var(--line); font-size:.92rem; align-items:start}
.up:last-child{border-bottom:0}
.up .d{font-family:var(--f-ui); font-weight:800; line-height:1.1}

function quiz(st,ui){
  st.ans=st.ans||{};
  const ans=st.ans, f=ui.qf||"all";
  const list=QS.filter(q=>f==="all"||q.a===f);
  const done=list.filter(q=>ans[q.id]!=null), ok=done.filter(q=>ans[q.id]===q.c).length;
  const chips=[["all","Todas"]].concat(AREAS.map(a=>[a.id,a.name]));
  const stats=AREAS.map(a=>{const qs=QS.filter(q=>q.a===a.id),d=qs.filter(q=>ans[q.id]!=null);return {a,n:qs.length,d:d.length,ok:d.filter(q=>ans[q.id]===q.c).length}});
  return `<div class="cur">
  <section class="card">
    <h3>Questões no estilo FAFIPA</h3>
    <p class="small muted">Questões inéditas, feitas a partir do conteúdo do edital, no formato da banca: 5 alternativas e uma correta. Não são cópias de provas. Para treinar com provas reais, baixe as anteriores no site da FAFIPA ou filtre pela banca num site de questões.</p>
    <div class="chips" style="margin:10px 0 14px">${chips.map(([k,l])=>`<button class="chip ${f===k?"on":""}" data-cact="qf" data-f="${k}">${esc(l)}</button>`).join("")}</div>
    <div class="qsum">
      <div class="stat"><b>${done.length}/${list.length}</b><span class="small muted">respondidas</span></div>
      <div class="stat"><b>${ok}</b><span class="small muted">acertos</span></div>
      <div class="stat"><b>${done.length?Math.round(ok/done.length*100)+"%":"–"}</b><span class="small muted">aproveitamento</span></div>
      <span class="spacer"></span>
      ${done.length?`<button class="btn sm ghost" data-cact="reset">Refazer ${f==="all"?"todas":"esta matéria"}</button>`:""}
    </div>
    ${f==="all"?stats.map(s=>`<div class="hbar"><span class="row" style="gap:.4em;flex-wrap:nowrap"><span class="dot" style="--c:${s.a.color}"></span>${esc(s.a.name)}</span><div class="prog"><span style="width:${s.d?s.ok/s.d*100:0}%;--c:${s.a.color}"></span></div><span class="v">${s.ok}/${s.d||0}</span></div>`).join(""):""}
  </section>
  ${list.map((q,idx)=>{const a=areaById(q.a), r=ans[q.id], has=r!=null, right=has&&r===q.c;
    return `<article class="card" id="cq-${q.id}">
    <div class="cq-head"><span class="dot" style="--c:${a.color}"></span><span class="small muted">${esc(a.name)}</span><span class="spacer"></span><span class="tiny muted">Questão ${idx+1}</span></div>
    ${q.tx?`<blockquote class="cq-tx">${esc(q.tx)}</blockquote>`:""}
    <p class="cq-en">${esc(q.en)}</p>
    <div class="cq-ops">${q.op.map((op,i)=>{let cl="";if(has){cl=i===q.c?"right":i===r?"wrong":"dim"}
      return `<button class="cq-op ${cl}" data-cact="ans" data-q="${q.id}" data-i="${i}" ${has?"disabled":""}><b>${L[i]}</b><span>${esc(op)}</span></button>`}).join("")}</div>
    ${has?`<div class="cq-ex ${right?"ok":"no"}"><b>${right?"Certo!":"Não foi dessa vez."}</b> Gabarito: ${L[q.c]}. ${esc(q.ex)}</div>`:""}
    </article>`}).join("")}
  </div>`;
}

function onClick(b,st,ui){
  const a=b.dataset.cact;st.ans=st.ans||{};st.seen=st.seen||{};
  if(a==="ans"){const q=b.dataset.q;if(st.ans[q]!=null)return null;st.ans[q]=+b.dataset.i;return "save"}
  if(a==="qf"){ui.qf=b.dataset.f;return "ui"}
  if(a==="reset"){if(!confirm("Apagar suas respostas desta lista para refazer?"))return null;const f=ui.qf||"all";QS.forEach(q=>{if(f==="all"||q.a===f)delete st.ans[q.id]});return "save"}
  if(a==="preset"){st.calc={...PRESETS[b.dataset.p]};return "save"}
  if(a==="seen"){if(b.checked)st.seen[b.dataset.id]=1;else delete st.seen[b.dataset.id];return "save"}
  if(a==="goquiz"){ui.guideTab="questoes";return "ui"}
  if(a==="goedital"){ui.guideTab="curitiba";return "ui"}
  return null;
}
function onInput(t,st){
  if(!t.dataset||t.dataset.cin!=="calc")return false;
  if(!st.calc)st.calc=defCalc();
  const id=t.dataset.a, v=+t.value;st.calc[id]=v;
  const row=t.closest(".qrow");if(row)row.querySelectorAll(".sq i").forEach((el,i)=>el.classList.toggle("on",i<v));
  const set=(i,x)=>{const el=document.getElementById(i);if(el)el.innerHTML=x};
  set("cur-pts-"+id,fmtPts(v*2.5)+" pts");set("cur-ac-"+id,v);
  const tt=totals(st.calc), bar=document.getElementById("cur-bar");
  if(bar){bar.style.width=tt.pts+"%";bar.classList.toggle("pass",tt.pts>=60)}
  set("cur-msg",calcMsg(tt));
  return true;
}
return {edital,quiz,onClick,onInput,AREAS,QS};

/* Converte dados da versão anterior (com TJSP/Contagem e uma rotina só) */
function normalize(data){
  const D=defaultUser(), u={...D,...data};
  u.v=2;
  u.profile={...D.profile,...(data.profile||{})};
  u.settings={...D.settings,...(data.settings||{})};
  u.settings.avail={...D.settings.avail,...(u.settings.avail||{})};
  delete u.settings.focus;
  const ex=data.exams||{};
  u.exams={dmae:ex.dmae||D.exams.dmae,curitiba:ex.curitiba||D.exams.curitiba};
  u.cur={...D.cur,...(data.cur||{})};
  u.topics=data.topics||{};u.guide=data.guide||{};u.tmark=data.tmark||{};u.plan=data.plan||{};u.tasks=data.tasks||{};
  u.months=data.months||[];
  u.customSubjects=(data.customSubjects||[]).map(c=>({...c,ex:(c.ex||"").replace(/[^dk]/g,"")||"dk"}));
  u.autoPlans={...(data.autoPlans||{})};
  if(!data.routines){
    u.routines=JSON.parse(JSON.stringify(ROUTINES));
    if(data.routine){
      const ap=data.autoPlan, which=ap&&(ap.ex==="d"||ap.ex==="k")?ap.ex:(todayStr()<=u.exams.dmae?"d":"k");
      u.routines[which]=data.routine;
      if(ap&&ap.ex===which)u.autoPlans[which]=ap;
    }
  }else u.routines={d:data.routines.d||JSON.parse(JSON.stringify(ROUTINES.d)),k:data.routines.k||JSON.parse(JSON.stringify(ROUTINES.k))};
  delete u.routine;delete u.autoPlan;
  const ok=new Set(DEFAULT_SUBJECTS.map(s=>s.id).concat(u.customSubjects.map(c=>c.id)));
  const clean=bl=>(bl||[]).filter(b=>b&&ok.has(b.s));
  for(const x of ["d","k"])for(let d=0;d<7;d++)u.routines[x][d]=clean(u.routines[x][d]);
  for(const k of Object.keys(u.plan))u.plan[k]=clean(u.plan[k]);
  return u;
}

function subjById(id){return subjects().find(s=>s.id===id)||(LEGACY[id]?{id,name:LEGACY[id][0],color:LEGACY[id][1],ex:"",topics:[]}:{id,name:"Matéria removida",color:"#999",ex:"",topics:[]})}

function allSessions(){return Object.values(MONTHS).flat()}
function dayMap(){
  const m={};
  for(const s of allSessions()){
    const d=m[s.date]||(m[s.date]={total:0,by:{}});
    d.total+=s.sec;d.by[s.subj]=(d.by[s.subj]||0)+s.sec;
  }
  return m;
}
function level(sec){const m=sec/60;if(m<=0)return 0;if(m<30)return 1;if(m<60)return 2;if(m<120)return 3;if(m<180)return 4;return 5}
function streak(dm){
  let n=0;const d=new Date();
  if(!dm[ymd(d)])d.setDate(d.getDate()-1);
  while(dm[ymd(d)]&&dm[ymd(d)].total>0){n++;d.setDate(d.getDate()-1)}
  return n;
}
function bySubjectTotals(filterFn){
  const t={};for(const s of allSessions()){if(filterFn&&!filterFn(s))continue;t[s.subj]=(t[s.subj]||0)+s.sec}return t;
}

/* ======================================================================
   Cronograma: blocos de cada dia, assuntos e datas
   ====================================================================== */
function baseBlocks(k){
  if(k===U.exams.dmae||k===U.exams.curitiba)return [];
  return ((U.routines[examForDate(k)]||{})[parseYmd(k).getDay()]||[]).map(b=>({s:b.s,m:b.m}));
}
function blocksFor(k){return U.plan[k]||baseBlocks(k)}
function eventsFor(k){
  const ev=[];
  if(k===U.exams.dmae)ev.push({t:"Prova do DMAE",x:1});
  if(k===U.exams.curitiba)ev.push({t:"Prova de Curitiba",x:1});
  if(U.exams.dmae&&k===addDays(U.exams.dmae,-1))ev.push({t:"Véspera do DMAE: revisão leve, separar documento com foto e caneta preta, dormir cedo"});
  if(U.exams.curitiba&&k===addDays(U.exams.curitiba,-1))ev.push({t:"Véspera de Curitiba: viagem, revisão leve e dormir cedo"});
  MILESTONES.forEach(m=>{if(m[0]===k)ev.push({t:m[1]})});
  return ev;
}
function agendaEnd(){return addDays(mondayOf(U.exams.curitiba||U.exams.dmae||todayStr()),6)}
/* Distribui o próximo assunto pendente de cada matéria pelos blocos, dia a dia.
   Assunto marcado sai da fila; nos 6 dias antes da prova só entra revisão. */
function buildAgenda(from,to){
  const today=todayStr(), used=new Set(), days={}, cover={};
  const nextTopic=(s,ex,k)=>{
    for(let i=0;i<s.topics.length;i++){const t=s.topics[i];if(!t||!t[1].includes(ex))continue;
      const key=s.id+":"+i;if(used.has(key))continue;
      if(U.topics[key]&&!(k===today&&U.tmark[key]===today))continue;
      used.add(key);return i}
    return null;
  };
  for(let k=from;k<=to;k=addDays(k,1)){
    const ex=examForDate(k), ed=examDate(ex), left=ed?daysBetween(k,ed):99, past=k<today;
    days[k]=blocksFor(k).map(b=>{
      const o={s:b.s,m:b.m};if(past)return o;
      if(b.s==="rev"){o.label=left>=0&&left<=6?"Revisão final: caderno de erros e questões":"Caderno de erros e questões misturadas";return o}
      if(left>=0&&left<=6){o.label="Revisão e questões (sem assunto novo)";return o}
      const sj=subjById(b.s), i=nextTopic(sj,ex,k);
      if(i==null)o.label="Questões e revisão da matéria";else{o.ti=i;o.label=sj.topics[i][0]}
      return o;
    });
    if(k===U.exams.dmae)cover.d=new Set(used);
    if(k===U.exams.curitiba)cover.k=new Set(used);
  }
  return {days,cover};
}
function coverage(ex,cov){
  const miss={};let total=0,inPlan=0;
  for(const s of subjects()){if(s.id==="rev")continue;
    s.topics.forEach((t,i)=>{if(!t||!t[1].includes(ex))return;const key=s.id+":"+i;if(U.topics[key])return;total++;
      if(cov&&cov.has(key))inPlan++;else miss[s.id]=(miss[s.id]||0)+1})}
  return {total,inPlan,miss};
}
function upcoming(n){
  const out=[], today=todayStr();let k=addDays(today,1);const end=addDays(today,120);
  while(k<=end&&out.length<n){eventsFor(k).forEach(e=>out.push({k,...e}));(U.tasks[k]||[]).forEach(t=>{if(!t.done)out.push({k,t:t.t})});k=addDays(k,1)}
  return out.slice(0,n);
}

function elapsedMs(r){if(!r)return 0;return (r.acc||0)+(r.startedAt?Date.now()-r.startedAt:0)}
function timerStart(subj,topic,mode){
  U.running={subj,topic:topic||"",mode:mode||0,acc:0,startedAt:Date.now(),begin:new Date().toISOString(),date:todayStr(),alerted:false};
  saveUser(true);render();
}
function timerPause(){const r=U.running;if(!r||!r.startedAt)return;r.acc=elapsedMs(r);r.startedAt=null;saveUser(true);render()}
function timerResume(){const r=U.running;if(!r||r.startedAt)return;r.startedAt=Date.now();saveUser(true);render()}
async function timerStop(){
  const r=U.running;if(!r)return;
  const sec=Math.round(elapsedMs(r)/1000);
  const note=($("#tNote")&&$("#tNote").value||"").trim();
  const date=r.date||todayStr(), sn=snap(date.slice(0,7),false);
  U.running=null;saveUser(true);
  if(sec<30){toast("Sessão muito curta — não foi registrada.");render();return}
  let extra="";
  if(r.topic!==""&&r.topic!=null&&sec>=20*60){const key=r.subj+":"+r.topic;
    if(!U.topics[key]){U.topics[key]=1;U.tmark[key]=todayStr();saveUser();extra=" · assunto marcado"}}
  await addSession({id:newId(),date,begin:r.begin,sec,subj:r.subj,topic:r.topic||"",note});
  render();offerUndo(`Registrado: ${fmtHM(sec)} de ${subjById(r.subj).name}${extra}`,sn);
}
function timerDiscard(){const sn=snap(null,false);U.running=null;saveUser(true);render();offerUndo("Tempo descartado.",sn)}
function beep(){
  try{const ctx=new (window.AudioContext||window.webkitAudioContext)();[0,.35,.7].forEach(t=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=880;g.gain.setValueAtTime(.001,ctx.currentTime+t);g.gain.exponentialRampToValueAtTime(.3,ctx.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+.28);o.connect(g).connect(ctx.destination);o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+.3)})}catch(e){}
}
setInterval(()=>{
  const r=U&&U.running;if(!r)return;
  const ms=elapsedMs(r);
  const clk=$("#clock");if(clk)clk.textContent=fmtClock(ms);
  if(r.mode){
    const bar=$("#tBar");if(bar)bar.style.width=Math.min(100,ms/(r.mode*60000)*100)+"%";
    if(ms>=r.mode*60000&&!r.alerted&&r.startedAt){r.alerted=true;timerPause();beep();toast(`${r.mode} minutos! Hora de uma pausa.`);
      if("Notification" in window&&Notification.permission==="granted")new Notification("Pausa!",{body:`Você completou ${r.mode} min de ${subjById(r.subj).name}.`})}

const mqDark=matchMedia("(prefers-color-scheme: dark)");
function themePref(){return (U&&U.settings.theme)||localStorage.getItem(LS+"theme")||"auto"}
function isDark(){const t=themePref();return t==="dark"||(t==="auto"&&mqDark.matches)}
function applyTheme(){
  const t=themePref(), h=document.documentElement;
  if(t==="auto")delete h.dataset.theme;else h.dataset.theme=t;
  h.dataset.eff=isDark()?"dark":"light";
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=isDark()?"#0E1430":"#F6F8FC";
}

function toggleTheme(btn){
  const next=isDark()?"light":"dark";
  const apply=()=>{localStorage.setItem(LS+"theme",next);if(U){U.settings.theme=next;saveUser();const sel=$("#sTheme");if(sel)sel.value=next}applyTheme()};
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce){apply();return}
  if(!document.startViewTransition){
    const h=document.documentElement;h.classList.add("theming");apply();setTimeout(()=>h.classList.remove("theming"),500);return;
  }
  const r=btn.getBoundingClientRect(), x=r.left+r.width/2, y=r.top+r.height/2;
  const rad=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
  const vt=document.startViewTransition(apply);
  vt.ready.then(()=>document.documentElement.animate(
    {clipPath:[`circle(0px at ${x}px ${y}px)`,`circle(${rad}px at ${x}px ${y}px)`]},
    {duration:600,easing:"cubic-bezier(.6,0,.3,1)",pseudoElement:"::view-transition-new(root)"})).catch(()=>{});
}

  </div>${weeks}`;

/* ---------- Organizador automático (semana-modelo) ----------
   Peso de cada matéria = pontos que ela vale na prova.
   O que falta estudar pesa mais; matéria toda estudada fica com ~25% do peso. */
const EXAM_WEIGHTS={
  d:{port:10,rl:3.5,mat:5,matav:1.5,cg:5,legdmae:5,adm:8,arq:5,admpub:7},
  k:{port:12.5,rl:6,mat:6.5,info:12.5,legctba:8,dconst:12,admpub:20,adm:12,arq:10}
};
function remainingInfo(s,ex){
  const idx=s.topics.map((_,i)=>i).filter(i=>s.topics[i]&&s.topics[i][1].includes(ex));
  if(!idx.length)return {n:0,nw:0,rv:0,frac:1};
  let nw=0,rv=0;idx.forEach(i=>{const v=U.topics[s.id+":"+i]||0;if(!v)nw++;else if(v===1)rv++});
  return {n:idx.length,nw,rv,frac:(nw+0.4*rv)/idx.length};
}
function studiedCount(ex){let n=0;for(const s of subjects())s.topics.forEach((t,i)=>{if(t&&t[1].includes(ex)&&U.topics[s.id+":"+i])n++});return n}
function buildAutoRoutine(ex,avail,B){
  const W=EXAM_WEIGHTS[ex]||{};
  const subs=subjects().filter(s=>s.id!=="rev"&&(W[s.id]!=null||(s.custom&&s.ex.includes(ex))));
  const cap={};let total=0;for(let d=0;d<7;d++){cap[d]=Math.max(0,+avail[d]||0);total+=cap[d]}
  if(total<30)return null;
  const revMin=total>=300?Math.round(total*.15/15)*15:0;
  const studyMin=total-revMin;
  const rows=subs.map(s=>{const r=remainingInfo(s,ex),w=W[s.id]??3;return {id:s.id,w,r,score:w*(0.25+0.75*r.frac)}});
  const sum=rows.reduce((a,x)=>a+x.score,0)||1;
  rows.forEach(x=>{const m=studyMin*x.score/sum;x.min=m<20?0:Math.max(30,Math.round(m/15)*15)});
  let diff=studyMin-rows.reduce((a,x)=>a+x.min,0), guard=200;
  while(Math.abs(diff)>=15&&guard--){const cand=rows.filter(x=>x.min>0&&(diff>0||x.min>30)).sort((a,b)=>b.score-a.score);if(!cand.length)break;
    const k=diff>0?0:cand.length-1;cand[k].min+=diff>0?15:-15;diff+=diff>0?-15:15}
  const split=(m,max)=>{const out=[];while(m>0){if(m>=max+30){out.push(max);m-=max}else{out.push(m);m=0}}return out};
  const blocks=[];
  split(revMin,120).forEach(m=>blocks.push({s:"rev",m,w:0}));
  rows.forEach(x=>split(x.min,B).forEach(m=>blocks.push({s:x.id,m,w:x.w})));
  blocks.sort((a,b)=>(a.s==="rev"?-1:0)-(b.s==="rev"?-1:0)||b.m-a.m||b.w-a.w);
  const plan={0:[],1:[],2:[],3:[],4:[],5:[],6:[]};
  for(const bl of blocks){
    let best=-1,bs=-Infinity;
    for(let d=0;d<7;d++){if(cap[d]<30)continue;
      let sc=Math.min(cap[d],bl.m)*10+cap[d];
      if(plan[d].some(x=>x.s===bl.s))sc-=5000;
      if(plan[(d+6)%7].some(x=>x.s===bl.s)||plan[(d+1)%7].some(x=>x.s===bl.s))sc-=300;
      if(bl.s==="rev"&&(d===0||d===6))sc+=3000;
      if(sc>bs){bs=sc;best=d}}
    if(best<0)continue;
    const m=Math.min(bl.m,Math.floor(cap[best]/15)*15);if(m<30)continue;
    const same=plan[best].find(x=>x.s===bl.s);
    if(same)same.m+=m;else plan[best].push({s:bl.s,m,w:bl.w});
    cap[best]-=m;
  }
  for(let d=0;d<7;d++){
    if(cap[d]>=15&&plan[d].length){plan[d].sort((a,b)=>b.m-a.m)[0].m+=Math.floor(cap[d]/15)*15}
    plan[d].sort((a,b)=>(a.s==="rev")-(b.s==="rev")||b.w-a.w);
    plan[d]=plan[d].map(({s,m})=>({s,m}));
  }
  const weekly={};for(let d=0;d<7;d++)plan[d].forEach(b=>weekly[b.s]=(weekly[b.s]||0)+b.m);
  return {plan,summary:{ex,at:todayStr(),studied:studiedCount(ex),B,
    rows:rows.map(x=>({id:x.id,w:x.w,n:x.r.n,nw:x.r.nw,rv:x.r.rv,min:weekly[x.id]||0})).sort((a,b)=>b.min-a.min),rev:weekly.rev||0}};
}
function runAutoRoutine(ex){
  const res=buildAutoRoutine(ex,U.settings.avail,U.settings.blockMin||60);
  if(!res){toast("Coloque pelo menos 30 minutos disponíveis na semana.");return false}
  U.routines[ex]=res.plan;U.autoPlans[ex]=res.summary;return true;
}

  const ap=U.autoPlans[ex];if(!ap)return "";
  const d=studiedCount(ex)-ap.studied;

}

/* ---------- Exportar para Google Agenda ---------- */
function exportICS(){
  const today=todayStr(), end=agendaEnd();
  if(end<today){toast("Não há dias futuros no cronograma.");return}
  const {days}=buildAgenda(today,end);
  const e=s=>String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");
  const stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+Z$/,"Z");
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Caderno de Estudos//PT-BR","CALSCALE:GREGORIAN","X-WR-CALNAME:Cronograma de estudos"];
  const add=(k,sum,desc,uid)=>{L.push("BEGIN:VEVENT","UID:"+uid+"@caderno-estudos","DTSTAMP:"+stamp,"DTSTART;VALUE=DATE:"+k.replace(/-/g,""),"DTEND;VALUE=DATE:"+addDays(k,1).replace(/-/g,""),"SUMMARY:"+e(sum));if(desc)L.push("DESCRIPTION:"+e(desc));L.push("TRANSP:TRANSPARENT","END:VEVENT")};
  for(const [k,items] of Object.entries(days)){
    eventsFor(k).forEach((x,i)=>add(k,(x.x?"🎯 ":"📌 ")+x.t,"","ev"+k+i));
    if(items.length)add(k,"📚 Estudo: "+fmtHM(items.reduce((a,b)=>a+b.m,0)*60),items.map(b=>`${subjById(b.s).name} (${fmtHM(b.m*60)})${b.label?" — "+b.label:""}`).join("\n"),"st"+k);
    (U.tasks[k]||[]).forEach((t,i)=>{if(!t.done)add(k,"✔ "+t.t,"","tk"+k+i)});
  }
  L.push("END:VCALENDAR");
  download(new Blob([L.join("\r\n")],{type:"text/calendar;charset=utf-8"}),`cronograma-${today}.ics`);
  toast("Arquivo baixado. No Google Agenda: Configurações › Importar e exportar › Importar.",5000);
}

  tip.innerHTML=`<b>${fmtDateLong(k)}</b><div style="margin:4px 0 2px">${v&&v.total?"Total: <b>"+fmtHM(v.total)+"</b>":"Sem estudo registrado"}</div>`+
    (v?Object.entries(v.by).sort((a,b)=>b[1]-a[1]).map(([s,sec])=>{const sj=subjById(s);return `<div class="r"><span class="dot" style="--c:${sj.color}"></span><span>${esc(sj.name)}</span><span>${fmtHM(sec)}</span></div>`}).join(""):"");
  tip.classList.remove("hide");

  const a=b.dataset.act;
  if(a==="gchk"||a==="agtopic"||a==="taskchk")return; // tratados no "change"
  if(a==="start"){const s=$("#tSubj").value,t=$("#tTopic").value;UI.lastSubj=s;UI.note="";timerStart(s,t,UI.mode||0);
    if(UI.mode&&"Notification" in window&&Notification.permission==="default")Notification.requestPermission();}
  else if(a==="quickstart"){if(U.running)return;UI.lastSubj=b.dataset.s;UI.note="";closeModal();timerStart(b.dataset.s,b.dataset.t||"",0);if(UI.view!=="inicio")location.hash="#inicio";scrollTo(0,0)}
  else if(a==="pause")timerPause();
  else if(a==="resume"){U.running.alerted=U.running.mode?elapsedMs(U.running)>=U.running.mode*60000:false;timerResume()}
  else if(a==="stop")await timerStop();
  else if(a==="discard")timerDiscard();
  else if(a==="manual")manualModal(b.dataset.date);
  else if(a==="savemanual"){
    const sec=((+$("#mH").value||0)*60+(+$("#mM").value||0))*60, date=$("#mDate").value;
    if(!date||sec<=0){toast("Informe o dia e um tempo maior que zero.");return}
    const sn=snap(date.slice(0,7));
    await addSession({id:newId(),date,begin:"",sec,subj:$("#mSubj").value,topic:"",note:$("#mNote").value.trim()});
    closeModal();render();offerUndo("Tempo registrado.",sn);
  }
  else if(a==="delsess"){const dt=b.dataset.date, sn=snap(dt.slice(0,7));await deleteSession(dt,b.dataset.id);render();openDay(dt);offerUndo("Sessão apagada.",sn)}
  else if(a==="mprev"||a==="mnext"){UI.calMonth+=a==="mnext"?1:-1;if(UI.calMonth<0){UI.calMonth=11;UI.calYear--}if(UI.calMonth>11){UI.calMonth=0;UI.calYear++}await ensureYear(UI.calYear);render()}
  else if(a==="sfilter"){UI.subjFilter=b.dataset.f;render()}
  else if(a==="topic"){const k=b.dataset.k, sn=snap();const v=((U.topics[k]||0)+1)%3;if(v)U.topics[k]=v;else delete U.topics[k];
    if(v===1)U.tmark[k]=todayStr();if(!v)delete U.tmark[k];
    UI.openSubj=k.split(":")[0];saveUser();render();offerUndo(["Marcação removida.","Marcado como estudado.","Marcado como revisado."][v],sn)}
  else if(a==="newsubj")subjModal();
  else if(a==="savesubj"){
    const name=$("#nsName").value.trim();if(!name){toast("Dê um nome para a matéria.");return}
    const ex=$$(".nsEx").filter(x=>x.checked).map(x=>x.value).join("")||"dk";
    U.customSubjects.push({id:"c_"+newId(),name,color:$("#nsColor").value,ex,topics:$("#nsTopics").value.split("\n").map(s=>s.trim()).filter(Boolean),tip:""});
    saveUser();closeModal();render();toast("Matéria criada.");
  }
  else if(a==="delsubj"){if(!confirm("Remover esta matéria? As horas já registradas continuam no histórico."))return;const sn=snap();U.customSubjects=U.customSubjects.filter(s=>s.id!==b.dataset.s);saveUser();render();offerUndo("Matéria removida.",sn)}
  /* ---- Cronograma ---- */
  else if(a==="ctab"){UI.ctab=b.dataset.t;render()}
  else if(a==="rex"){UI.rex=b.dataset.x;render()}
  else if(a==="newtask")taskModal();
  else if(a==="savetask"){const t=$("#tkText").value.trim(), k=$("#tkDate").value;if(!t||!k){toast("Escreva a tarefa e escolha o dia.");return}
    const sn=snap();(U.tasks[k]=U.tasks[k]||[]).push({t,done:false});saveUser();closeModal();render();offerUndo(`Tarefa adicionada em ${ddmm(k)}.`,sn)}
  else if(a==="ics")exportICS();
  else if(a==="editday"){UI.ed=null;editDayModal(b.dataset.k)}
  else if(a==="edAddB"){readEd();const last=UI.ed.blocks[UI.ed.blocks.length-1];UI.ed.blocks.push({s:last?last.s:"port",m:60});editDayModal(UI.ed.k)}
  else if(a==="edDelB"){readEd();UI.ed.blocks.splice(+b.dataset.i,1);editDayModal(UI.ed.k)}
  else if(a==="edAddT"){readEd();UI.ed.tasks.push({t:"",done:false});editDayModal(UI.ed.k);const ins=$$("#modalBg [data-ed=t]");if(ins.length)ins[ins.length-1].focus()}
  else if(a==="edDelT"){readEd();UI.ed.tasks.splice(+b.dataset.i,1);editDayModal(UI.ed.k)}
  else if(a==="edOff"){readEd();UI.ed.blocks=[];editDayModal(UI.ed.k)}
  else if(a==="edSave"){readEd();const E=UI.ed,k=E.k,sn=snap();
    if(JSON.stringify(E.blocks)===JSON.stringify(baseBlocks(k)))delete U.plan[k];else U.plan[k]=E.blocks;
    const tasks=E.tasks.map(t=>({...t,t:(t.t||"").trim()})).filter(t=>t.t);
    if(tasks.length)U.tasks[k]=tasks;else delete U.tasks[k];
    UI.ed=null;saveUser();closeModal();render();offerUndo(`Dia ${ddmm(k)} atualizado.`,sn)}
  else if(a==="edReset"){const k=UI.ed.k,sn=snap();delete U.plan[k];UI.ed=null;saveUser();closeModal();render();offerUndo(`${ddmm(k)} voltou à semana-modelo.`,sn)}
  /* ---- Semana-modelo ---- */
  else if(a==="loadroutine"){const ex=b.dataset.x;if(!confirm(`Substituir a semana-modelo ${ex==="d"?"do DMAE":"de Curitiba"} pela rotina sugerida no Guia?`))return;
    const sn=snap();U.routines[ex]=JSON.parse(JSON.stringify(ROUTINES[ex]));delete U.autoPlans[ex];UI.rex=ex;UI.ctab="semana";saveUser();
    if(UI.view!=="cronograma")location.hash="#cronograma";else render();setTimeout(()=>offerUndo("Rotina carregada.",sn),50)}
  else if(a==="addblk")blockModal(+b.dataset.d);
  else if(a==="saveblk"){const d=+b.dataset.d;const m=Math.max(5,+$("#bMin").value||60);const sn=snap();const R=curR();(R[d]=R[d]||[]).push({s:$("#bSubj").value,m});saveUser();closeModal();render();offerUndo("Bloco adicionado.",sn)}
  else if(a==="delblk"){const sn=snap();curR()[b.dataset.d].splice(+b.dataset.i,1);saveUser();closeModal();render();offerUndo("Bloco removido.",sn)}
  else if(a==="editblk")editBlockModal(+b.dataset.d,+b.dataset.i);
  else if(a==="saveedit"){const d=+b.dataset.d,i=+b.dataset.i,sn=snap(),R=curR();const blk=R[d][i];
    const m=Math.max(5,Math.min(600,Math.round(+$("#eMin").value||blk.m)));const nd=+$("#eDay").value;
    const nb={s:$("#eSubj").value,m};
    if(nd===d)R[d][i]=nb;else{R[d].splice(i,1);(R[nd]=R[nd]||[]).push(nb)}
    saveUser();closeModal();render();offerUndo("Bloco atualizado.",sn)}
  else if(a==="stepblk"){const d=+b.dataset.d,i=+b.dataset.i,blk=curR()[d][i];const nm=Math.max(15,Math.min(600,blk.m+(+b.dataset.v)));
    if(nm===blk.m)return;const sn=snap();blk.m=nm;saveUser();render();offerUndo(`${subjById(blk.s).name}: ${fmtHM(nm*60)}`,sn)}
  else if(a==="autoroutine"){const ex=rex(),sn=snap();if(runAutoRoutine(ex)){saveUser();render();offerUndo(`Semana ${ex==="d"?"do DMAE":"de Curitiba"} organizada.`,sn)}}
  else if(a==="blocklen"){U.settings.blockMin=+b.dataset.v;saveUser();render()}
   /* ---- Guia e perfil ---- */
  else if(a==="gtab"){UI.guideTab=b.dataset.t;render()}
  else if(a==="gotab"){UI.guideTab=b.dataset.t;if(UI.view==="guia"){render();scrollTo(0,0)}}
  else if(a==="gomat"){UI.subjFilter="k";location.hash="#materias"}
  else if(a==="saveprof"){U.profile.name=$("#pName").value.trim();U.profile.phrases=$("#pPhr").value.split("\n").map(s=>s.trim()).filter(Boolean);UI.phrase=null;cacheLockProfile();await saveUser(true);toast("Perfil salvo.");render()}
  else if(a==="rmphoto"){const sn=snap();U.profile.photo="";cacheLockProfile();saveUser();render();offerUndo("Foto removida.",sn)}
  else if(a==="saveexams"){["dmae","curitiba"].forEach(k=>U.exams[k]=$("#e_"+k).value||U.exams[k]);saveUser();toast("Datas salvas.");render()}
  else if(a==="export"){await loadAllMonths();download(new Blob([JSON.stringify({user:U,months:MONTHS},null,1)],{type:"application/json"}),`caderno-backup-${todayStr()}.json`)}
  else if(a==="logout"){if(U.running&&!confirm("Há um cronômetro ativo. Ele continua salvo. Sair mesmo assim?"))return;await Store.logout();location.reload()}
});

document.addEventListener("change",async e=>{
  if(!U)return;const t=e.target;
  if(t.id==="tSubj"){UI.lastSubj=t.value;fillTopicSelect()}
  else if(t.dataset&&t.dataset.act==="gchk"){const sn=snap();if(t.checked)U.guide[t.dataset.id]=1;else delete U.guide[t.dataset.id];saveUser();render();offerUndo(t.checked?"Meta marcada.":"Meta desmarcada.",sn)}
  else if(t.dataset&&t.dataset.act==="agtopic"){const k=t.dataset.key,sn=snap();
    if(t.checked){if(!U.topics[k])U.topics[k]=1;U.tmark[k]=todayStr()}else{delete U.topics[k];delete U.tmark[k]}
    saveUser();render();offerUndo(t.checked?"Assunto marcado como estudado.":"Marcação removida.",sn)}
  else if(t.dataset&&t.dataset.act==="taskchk"){const L=U.tasks[t.dataset.k],i=+t.dataset.i;if(L&&L[i]){L[i].done=t.checked;saveUser();render()}}
  else if(t.id==="calYear"){UI.calYear=+t.value;await ensureYear(UI.calYear);render()}
  else if(t.dataset&&t.dataset.avail!=null){const sn=snap();U.settings.avail[t.dataset.avail]=+t.value;let re=false;
    if(U.settings.autoReorg)for(const ex of Object.keys(U.autoPlans||{}))if(runAutoRoutine(ex))re=true;
    saveUser();render();if(re)offerUndo("Tempo alterado — semanas reorganizadas.",sn)}
  else if(t.id==="rAuto"){U.settings.autoReorg=t.checked;saveUser()}
  else if(t.id==="sGoal"){U.settings.goalMin=Math.max(10,+t.value||180);saveUser()}
  else if(t.id==="sTheme"){U.settings.theme=t.value;localStorage.setItem(LS+"theme",t.value);applyTheme();saveUser()}
  else if(t.id==="photoIn"&&t.files[0]){cropModal(t.files[0]);t.value=""}
  else if(t.id==="impIn"&&t.files[0]){
    try{const data=JSON.parse(await t.files[0].text());if(!data.user||!data.months)throw 0;
      if(!confirm("Restaurar este backup? Isso substitui os dados atuais."))return;
      U=normalize(data.user);MONTHS=data.months;U.months=Object.keys(MONTHS).sort();
      await saveUser(true);for(const ym of U.months)await Store.saveMonth(ym,MONTHS[ym]);toast("Backup restaurado.");render();
    }catch(err){toast("Arquivo de backup inválido.")}
  }
});

  if(d.matches("details.subj")){if(d.open)UI.openSubj=d.dataset.sid;else if(UI.openSubj===d.dataset.sid)UI.openSubj=null}
  else if(d.matches("details.wk-ag"))UI.weekOpen[d.dataset.w]=d.open;
},true);

addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="tkText"){e.preventDefault();const b=$('[data-act="savetask"]');if(b)b.click()}});
addEventListener("hashchange",()=>{let v=(location.hash||"#inicio").slice(1);if(v==="rotina")v="cronograma";UI.view=v;if(v==="inicio")UI.phrase=null;closeModal();render();scrollTo(0,0)});

/* ---------- Recorte da foto de perfil ---------- */
function cropModal(file){
  const url=URL.createObjectURL(file), img=new Image();
  img.onerror=()=>{URL.revokeObjectURL(url);toast("Não consegui abrir essa imagem. Tente JPG, PNG ou WEBP.")};
  img.onload=()=>{
    const S=280, dpr=Math.min(3,window.devicePixelRatio||1);
    const base=Math.max(S/img.width,S/img.height);
    const st={z:1,ox:0,oy:0};
    openModal(`<div class="top"><h2>Ajustar foto</h2><button class="close" data-close aria-label="Fechar">×</button></div>
      <p class="small muted" style="margin-bottom:6px">Arraste para posicionar e use o controle para aproximar. O que ficar dentro do círculo vira sua foto.</p>
      <div class="crop-stage"><canvas id="cropCv" width="${S*dpr}" height="${S*dpr}" aria-label="Área de recorte"></canvas></div>
      <div class="zoomrow"><span aria-hidden="true">−</span><input type="range" id="cropZ" min="1" max="5" step="0.01" value="1" aria-label="Zoom"><span aria-hidden="true">+</span></div>
      <div class="row"><button class="btn ghost" data-act="cropreset">Centralizar</button><span class="spacer"></span><button class="btn primary" id="cropOk">Usar esta foto</button></div>`);
    const cv=$("#cropCv"), ctx=cv.getContext("2d"), zr=$("#cropZ");
    const clamp=()=>{const k=base*st.z, mx=Math.max(0,(img.width*k-S)/2), my=Math.max(0,(img.height*k-S)/2);
      st.ox=Math.max(-mx,Math.min(mx,st.ox));st.oy=Math.max(-my,Math.min(my,st.oy))};
    const paint=(c,size,overlay)=>{const f=size/S,k=base*st.z*f,w=img.width*k,h=img.height*k;
      c.fillStyle="#0E1430";c.fillRect(0,0,size,size);
      c.imageSmoothingQuality="high";c.drawImage(img,size/2+st.ox*f-w/2,size/2+st.oy*f-h/2,w,h);
      if(overlay){c.save();c.fillStyle="rgba(14,20,48,.55)";c.beginPath();c.rect(0,0,size,size);c.arc(size/2,size/2,size/2-6*f,0,Math.PI*2,true);c.fill("evenodd");
        c.strokeStyle="rgba(255,255,255,.9)";c.lineWidth=2*f;c.beginPath();c.arc(size/2,size/2,size/2-6*f,0,Math.PI*2);c.stroke();c.restore()}};
    const draw=()=>{clamp();paint(ctx,S*dpr,true)};
    draw();
    const pts=new Map();let pinch=null;
    const scaleOf=()=>cv.getBoundingClientRect().width/S;
    cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:st.z}}});
    cv.addEventListener("pointermove",e=>{if(!pts.has(e.pointerId))return;const prev=pts.get(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(pts.size===2&&pinch){const [a,b]=[...pts.values()];st.z=Math.max(1,Math.min(5,pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d));zr.value=st.z}
      else{const sc=scaleOf();st.ox+=(e.clientX-prev.x)/sc;st.oy+=(e.clientY-prev.y)/sc}
      draw()});
    const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null};
    cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
    cv.addEventListener("wheel",e=>{e.preventDefault();st.z=Math.max(1,Math.min(5,st.z*(e.deltaY<0?1.08:1/1.08)));zr.value=st.z;draw()},{passive:false});
    zr.addEventListener("input",()=>{st.z=+zr.value;draw()});
    $("[data-act=cropreset]").addEventListener("click",e=>{e.stopPropagation();st.z=1;st.ox=0;st.oy=0;zr.value=1;draw()});
    cv.addEventListener("keydown",e=>{const step=10;if(e.key==="ArrowLeft")st.ox+=step;else if(e.key==="ArrowRight")st.ox-=step;else if(e.key==="ArrowUp")st.oy+=step;else if(e.key==="ArrowDown")st.oy-=step;else return;e.preventDefault();draw()});
    cv.tabIndex=0;
    $("#cropOk").addEventListener("click",async()=>{
      const out=document.createElement("canvas");out.width=out.height=256;paint(out.getContext("2d"),256,false);
      const sn=snap();U.profile.photo=out.toDataURL("image/jpeg",.85);URL.revokeObjectURL(url);
      cacheLockProfile();closeModal();await saveUser(true);render();offerUndo("Foto atualizada.",sn);
    });
  };
  img.src=url;
}
function cacheLockProfile(){try{localStorage.setItem(LS+"lock",JSON.stringify({name:U.profile.name,photo:U.profile.photo}))}catch(e){}}

async function ensureYear(y){
  const need=U.months.filter(ym=>ym.startsWith(y+"-")&&!MONTHS[ym]);
  await Promise.all(need.map(async ym=>{MONTHS[ym]=await Store.loadMonth(ym).catch(()=>[])}));
}
async function loadAllMonths(){await Promise.all(U.months.filter(ym=>!MONTHS[ym]).map(async ym=>{MONTHS[ym]=await Store.loadMonth(ym).catch(()=>[])}))}

/* ======================================================================
   Inicialização
   ====================================================================== */
async function openApp(){
  const data=await Store.loadUser();
  if(!data){U=defaultUser();await saveUser(true)}
  else{const old=data.v!==2;U=normalize(data);if(old)saveUser(true)} // converte a versão antiga uma vez
  await loadAllMonths();
  cacheLockProfile();
  $("#lock").classList.add("hide");$("#app").classList.remove("hide");document.body.classList.add("inapp");
  let v=(location.hash||"#inicio").slice(1);if(v==="rotina")v="cronograma";UI.view=v;
  render();setSync("ok");
  if(!U.profile.name)setTimeout(()=>{location.hash="#perfil";toast("Bem-vindo(a)! Coloque seu nome e uma foto.")},300);
}
function showLock(){
  const c=JSON.parse(localStorage.getItem(LS+"lock")||"null");
  if(c){ if(c.photo)$("#lockAvatar").innerHTML=`<img src="${c.photo}" alt="">`;else if(c.name)$("#lockAvatar").textContent=initials(c.name);
    if(c.name)$("#lockHello").textContent=`${greetWord()}, ${c.name.split(" ")[0]}!`; }
  else $("#lockHello").textContent=greetWord()+"!";
  $("#lockUser").value=LOGIN_EMAIL;
  $("#lock").classList.remove("hide");$("#lockPwd").focus();
}
$("#lockForm").addEventListener("submit",async e=>{
  e.preventDefault();const btn=$("#lockBtn");btn.disabled=true;$("#lockErr").textContent="";
  try{const u=await Store.login($("#lockPwd").value);$("#lockPwd").value="";Store.uid=u.uid;await openApp()}
  catch(err){console.error(err);$("#lockErr").textContent=authMsg(err)}
  finally{btn.disabled=false}
});
(async()=>{
  if(!FB_READY){showLock();$("#lockPwd").disabled=true;$("#lockBtn").disabled=true;
    $("#lockErr").textContent="O site ainda não está ligado ao Firebase. Preencha a configuração no index.html (veja o README).";return}
  try{await Store.init()}catch(e){console.error(e);showLock();$("#lockErr").textContent="Não foi possível carregar o Firebase. Verifique a configuração e a internet.";return}
  const u=await Store.currentUser();
  if(u){Store.uid=u.uid;try{await openApp()}catch(e){console.error(e);showLock();$("#lockErr").textContent="Não consegui carregar seus dados. Confira as regras do Firestore (README)."}}
  else showLock();
})();
</script>
