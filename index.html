<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2550">
<title>Caderno de Estudos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📒</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F8FC; --grid:#E4EAF5; --card:#FFFFFF; --ink:#1B2550; --ink2:#525C80; --ink3:#8A92AE;
  --line:#D8DFEC; --hl:#FFE45C; --hl2:#FFF3A8; --ok:#1F9D6B; --warn:#D9822B; --bad:#C8364A;
  --h0:#E9EEF7; --h1:#C9D8F5; --h2:#94B2EC; --h3:#5580DA; --h4:#2B4FB0; --h5:#16307A;
  --shadow:0 1px 0 rgba(27,37,80,.06), 0 6px 18px -10px rgba(27,37,80,.25);
  --r-lg:18px; --r-md:12px; --r-sm:8px;
  --f-ui:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-hand:"Caveat", "Comic Sans MS", cursive;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1430; --grid:#161E42; --card:#151D3F; --ink:#E7EBF8; --ink2:#AEB6D6; --ink3:#7580A8;
    --line:#26305A; --hl:#F5D93A; --hl2:#3D3A1F;
    --h0:#1A2349; --h1:#23386F; --h2:#2F55A6; --h3:#4679D6; --h4:#79A2F0; --h5:#B9CFFF;
    --shadow:0 1px 0 rgba(0,0,0,.2), 0 8px 22px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --paper:#0E1430; --grid:#161E42; --card:#151D3F; --ink:#E7EBF8; --ink2:#AEB6D6; --ink3:#7580A8;
  --line:#26305A; --hl:#F5D93A; --hl2:#3D3A1F;
  --h0:#1A2349; --h1:#23386F; --h2:#2F55A6; --h3:#4679D6; --h4:#79A2F0; --h5:#B9CFFF;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 8px 22px -12px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.5;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:26px 26px; background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--f-ui); line-height:1.15; margin:0 0 .5em; letter-spacing:-.01em}
h1{font-size:2rem; font-weight:800} h2{font-size:1.45rem; font-weight:800} h3{font-size:1.1rem; font-weight:600}
p{margin:0 0 .8em}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--h3); outline-offset:2px; border-radius:6px}
img{max-width:100%}
.muted{color:var(--ink2)} .small{font-size:.85rem} .tiny{font-size:.75rem}
.hide{display:none!important}

/* ---------- Botões e campos ---------- */
.btn{display:inline-flex; align-items:center; gap:.45em; border:1.5px solid var(--ink); background:var(--card); color:var(--ink);
  padding:.55em 1em; border-radius:999px; font-family:var(--f-ui); font-weight:600; font-size:.95rem; transition:transform .08s, background .15s}
.btn:hover{background:var(--hl2)} .btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink); color:var(--paper)} .btn.primary:hover{background:var(--h4); border-color:var(--h4)}
.btn.ghost{border-color:var(--line)} .btn.danger{border-color:var(--bad); color:var(--bad)}
.btn.sm{padding:.3em .75em; font-size:.85rem}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.field{display:flex; flex-direction:column; gap:.3em; margin-bottom:.9em}
.field label{font-family:var(--f-ui); font-weight:600; font-size:.9rem}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{
  width:100%; border:1.5px solid var(--line); background:var(--card); border-radius:var(--r-sm); padding:.55em .7em}
input:focus,select:focus,textarea:focus{border-color:var(--h3); outline:none}
textarea{min-height:110px; resize:vertical}
.row{display:flex; gap:.6em; align-items:center; flex-wrap:wrap}
.spacer{flex:1}

/* ---------- Tela de senha ---------- */
#lock{min-height:100%; display:grid; place-items:center; padding:24px}
.lockcard{background:var(--card); border:1.5px solid var(--line); border-radius:24px; padding:34px 30px; width:min(400px,100%); box-shadow:var(--shadow); text-align:center}
.lockcard .avatar{width:92px; height:92px; margin:0 auto 12px}
.lockcard .hand{font-family:var(--f-hand); font-size:2.3rem; line-height:1; margin-bottom:.2em}
.lockcard form{margin-top:18px; text-align:left}
.err{color:var(--bad); font-size:.9rem; min-height:1.3em}

/* ---------- Avatar ---------- */
.avatar{border-radius:50%; background:var(--hl); display:grid; place-items:center; overflow:hidden; font-family:var(--f-ui); font-weight:800; color:#1B2550; flex:none; border:2px solid var(--ink)}
.avatar img{width:100%; height:100%; object-fit:cover}

/* ---------- Layout ---------- */
#app{display:grid; grid-template-columns:236px 1fr; min-height:100%}
.side{position:sticky; top:0; height:100vh; height:100dvh; padding:22px 16px; border-right:1.5px solid var(--line); background:color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter:blur(6px); display:flex; flex-direction:column; gap:18px}
.brand{font-family:var(--f-ui); font-weight:800; font-size:1.15rem; display:flex; align-items:center; gap:.4em; padding:0 6px}
.me{display:flex; gap:10px; align-items:center; padding:10px; border-radius:var(--r-md); background:var(--card); border:1.5px solid var(--line)}
.me .avatar{width:42px; height:42px; font-size:1.1rem}
.me b{font-family:var(--f-ui); display:block; line-height:1.1}
nav.menu{display:flex; flex-direction:column; gap:2px}
nav.menu a{display:flex; gap:.6em; align-items:center; text-decoration:none; color:var(--ink2); font-family:var(--f-ui); font-weight:600; padding:.55em .7em; border-radius:10px}
nav.menu a:hover{color:var(--ink); background:var(--card)}
nav.menu a.on{color:#1B2550; background:var(--hl)}
nav.menu .ic{width:1.3em; text-align:center}
.sync{margin-top:auto; font-size:.78rem; color:var(--ink3); padding:0 6px; display:flex; align-items:center; gap:.4em}
.sync i{width:8px; height:8px; border-radius:50%; background:var(--ok); display:inline-block}
.sync.saving i{background:var(--warn)} .sync.error i{background:var(--bad)}
main{padding:28px clamp(16px,4vw,44px) 90px; max-width:1180px; width:100%}
.view-head{display:flex; align-items:end; gap:1em; flex-wrap:wrap; margin-bottom:18px}
.view-head h1{margin:0}

@media (max-width:860px){
  #app{grid-template-columns:1fr}
  .side{position:fixed; top:auto; bottom:0; left:0; right:0; height:auto; z-index:40; flex-direction:row; padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px)); border-right:0; border-top:1.5px solid var(--line); gap:0}
  .brand,.me,.sync{display:none}
  nav.menu{flex-direction:row; width:100%; justify-content:space-around}
  nav.menu a{flex-direction:column; gap:0; font-size:.68rem; padding:.35em .2em; text-align:center}
  nav.menu a .ic{font-size:1.25rem}
  nav.menu a.on{background:var(--hl2)}
  main{padding-bottom:110px}
  h1{font-size:1.6rem}
}

/* ---------- Cartões ---------- */
.card{background:var(--card); border:1.5px solid var(--line); border-radius:var(--r-lg); padding:18px 20px; box-shadow:var(--shadow)}
.card h3{display:flex; align-items:center; gap:.5em}
.grid{display:grid; gap:16px}
.g-home{grid-template-columns:1.25fr 1fr}
.g-2{grid-template-columns:1fr 1fr}
@media (max-width:980px){.g-home,.g-2{grid-template-columns:1fr}}

/* ---------- Saudação ---------- */
.hello{display:flex; gap:18px; align-items:center; margin-bottom:22px}
.hello .avatar{width:74px; height:74px; font-size:1.8rem}
.hello .hand{font-family:var(--f-hand); font-size:clamp(2.1rem,5vw,3rem); line-height:.95; font-weight:700}
.hello .phrase{font-family:var(--f-hand); font-size:1.45rem; color:var(--ink2); line-height:1.15; margin-top:4px}
.countdowns{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px}
.cd{display:flex; align-items:baseline; gap:.45em; padding:.45em .9em; border-radius:999px; border:1.5px solid var(--line); background:var(--card); font-family:var(--f-ui)}
.cd b{font-size:1.25rem; font-weight:800}
.cd.soon{border-color:var(--ink); background:var(--hl2)}

/* ---------- Cronômetro ---------- */
.timer{position:relative; overflow:hidden}
.timer .clock{font-family:var(--f-ui); font-weight:800; font-size:clamp(3rem,9vw,4.8rem); letter-spacing:-.02em; line-height:1; margin:.25em 0 .2em; font-variant-numeric:tabular-nums}
.timer .subjline{display:flex; align-items:center; gap:.5em; font-family:var(--f-ui); font-weight:600}
.timer .state{font-size:.85rem; color:var(--ink2)}
.timer.running .clock{color:var(--ink)}
.timer.paused .clock{color:var(--ink3)}
.timer .bar{position:absolute; left:0; bottom:0; height:6px; background:var(--subj, var(--h3)); transition:width 1s linear}
.segmented{display:inline-flex; border:1.5px solid var(--line); border-radius:999px; overflow:hidden}
.segmented button{border:0; background:transparent; padding:.35em .8em; font-family:var(--f-ui); font-weight:600; font-size:.85rem; color:var(--ink2)}
.segmented button.on{background:var(--ink); color:var(--paper)}
.dot{width:.75em; height:.75em; border-radius:50%; display:inline-block; flex:none; background:var(--c,#999)}

/* ---------- Progresso ---------- */
.prog{height:10px; border-radius:99px; background:var(--h0); overflow:hidden}
.prog>span{display:block; height:100%; background:var(--c, var(--h3)); border-radius:99px}
.stat{font-family:var(--f-ui)} .stat b{display:block; font-size:1.7rem; font-weight:800; line-height:1.1}
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px}
.plan-item{display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center; padding:8px 0; border-bottom:1px dashed var(--line)}
.plan-item:last-child{border-bottom:0}
.plan-item .prog{grid-column:2/4; height:7px}
.plan-item.done .nm{text-decoration:line-through; text-decoration-color:var(--ok); text-decoration-thickness:2px}

/* ---------- Barras da semana ---------- */
.week{display:grid; grid-template-columns:repeat(7,1fr); gap:8px; align-items:end; height:140px; margin-top:8px}
.week .col{display:flex; flex-direction:column-reverse; height:100%; border-radius:6px; background:var(--h0); overflow:hidden; cursor:pointer}
.week .col span{display:block; width:100%}
.week.lbl{height:auto; align-items:start; text-align:center; font-size:.78rem; color:var(--ink2); margin-top:4px}
.week.lbl b{display:block; color:var(--ink); font-family:var(--f-ui)}

/* ---------- Heatmap ---------- */
.heat-wrap{overflow-x:auto; padding-bottom:6px}
.heat{display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,14px); gap:3px; width:max-content}
.heat .c{width:14px; height:14px; border-radius:3px; background:var(--h0); cursor:pointer}
.heat .c.out{visibility:hidden}
.heat .c.today{outline:2px solid var(--ink); outline-offset:1px}
.l0{background:var(--h0)!important} .l1{background:var(--h1)!important} .l2{background:var(--h2)!important} .l3{background:var(--h3)!important} .l4{background:var(--h4)!important} .l5{background:var(--h5)!important}
.months-lbl{display:grid; grid-auto-flow:column; grid-auto-columns:17px; font-size:.72rem; color:var(--ink2); height:16px; width:max-content}
.heat-row{display:flex; gap:6px}
.heat-days{display:grid; grid-template-rows:repeat(7,14px); gap:3px; font-size:.68rem; color:var(--ink3); padding-top:16px}
.legend{display:flex; align-items:center; gap:4px; font-size:.75rem; color:var(--ink2)}
.legend i{width:13px; height:13px; border-radius:3px; display:inline-block}

/* ---------- Calendário do mês ---------- */
.mcal{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
.mcal .hd{font-family:var(--f-ui); font-weight:600; font-size:.8rem; color:var(--ink2); text-align:center}
.mcal .day{min-height:78px; border:1.5px solid var(--line); border-radius:10px; padding:6px 7px; background:var(--card); cursor:pointer; display:flex; flex-direction:column; gap:4px; text-align:left}
.mcal .day:hover{border-color:var(--ink)}
.mcal .day.empty{visibility:hidden}
.mcal .day.today{border-color:var(--ink); box-shadow:inset 0 -4px 0 var(--hl)}
.mcal .day .n{font-family:var(--f-ui); font-weight:600; font-size:.85rem}
.mcal .day .t{font-family:var(--f-ui); font-weight:800; font-size:.95rem; margin-top:auto}
.mcal .stack{display:flex; height:7px; border-radius:4px; overflow:hidden; background:var(--h0)}
@media (max-width:620px){ .mcal .day{min-height:56px; padding:4px} .mcal .day .t{font-size:.72rem} .mcal .day .n{font-size:.75rem} }

.tip{position:fixed; z-index:90; pointer-events:none; background:var(--ink); color:var(--paper); border-radius:10px; padding:8px 11px; font-size:.82rem; min-width:170px; max-width:260px; box-shadow:0 8px 24px -8px rgba(0,0,0,.5)}
.tip b{font-family:var(--f-ui)}
.tip .r{display:flex; align-items:center; gap:.45em}
.tip .r span:last-child{margin-left:auto; font-variant-numeric:tabular-nums}

.hbar{display:grid; grid-template-columns:minmax(110px,190px) 1fr 58px; gap:10px; align-items:center; margin:6px 0; font-size:.9rem}
.hbar .prog{height:12px}
.hbar .v{text-align:right; font-family:var(--f-ui); font-weight:600; font-variant-numeric:tabular-nums}

/* ---------- Matérias ---------- */
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{border:1.5px solid var(--line); border-radius:999px; padding:.25em .75em; background:var(--card); font-family:var(--f-ui); font-weight:600; font-size:.85rem; color:var(--ink2)}
.chip.on{border-color:var(--ink); color:var(--ink); background:var(--hl2)}
.tag{display:inline-block; font-family:var(--f-ui); font-size:.68rem; font-weight:600; padding:.05em .5em; border-radius:6px; border:1px solid var(--line); color:var(--ink2); margin-left:4px; white-space:nowrap}
.tag.d{border-color:#0EA5E9; color:#0B7FB5} .tag.c{border-color:#E4508F; color:#B8306C} .tag.t{border-color:#B45309; color:#9A4A0B}
:root[data-theme="dark"] .tag.d{color:#6CCBF5} :root[data-theme="dark"] .tag.c{color:#F59BC3} :root[data-theme="dark"] .tag.t{color:#F0B37A}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tag.d{color:#6CCBF5} :root:not([data-theme="light"]) .tag.c{color:#F59BC3} :root:not([data-theme="light"]) .tag.t{color:#F0B37A} }
.subj{border-left:7px solid var(--c); padding:0}
.subj>summary{list-style:none; cursor:pointer; padding:14px 18px; display:grid; grid-template-columns:1fr auto; gap:6px 14px; align-items:center}
.subj>summary::-webkit-details-marker{display:none}
.subj>summary h3{margin:0}
.subj .meta{font-size:.85rem; color:var(--ink2)}
.subj .body{padding:0 18px 16px}
.topic{display:flex; gap:10px; align-items:flex-start; padding:7px 0; border-top:1px dashed var(--line)}
.topic button.st{width:26px; height:26px; border-radius:7px; border:1.5px solid var(--ink3); background:transparent; flex:none; display:grid; place-items:center; font-size:.85rem; font-weight:700}
.topic button.st.s1{background:var(--c); border-color:var(--c); color:#fff}
.topic button.st.s2{background:var(--ink); border-color:var(--ink); color:var(--paper)}
.topic .tt{flex:1}
.tipbox{background:var(--hl2); border-radius:10px; padding:10px 12px; font-size:.92rem; margin:6px 0 10px}

/* ---------- Rotina ---------- */
.rout{display:grid; grid-template-columns:repeat(7,minmax(150px,1fr)); gap:10px; overflow-x:auto; padding-bottom:6px}
.rday{background:var(--card); border:1.5px solid var(--line); border-radius:var(--r-md); padding:10px; min-width:150px}
.rday.today{border-color:var(--ink); box-shadow:inset 0 5px 0 var(--hl)}
.rday h4{font-family:var(--f-ui); margin:0 0 6px; display:flex; justify-content:space-between}
.blk{display:flex; align-items:center; gap:6px; padding:6px 7px; border-radius:8px; margin-bottom:5px; background:color-mix(in srgb, var(--c) 16%, var(--card)); font-size:.85rem}
.blk .x{margin-left:auto; border:0; background:transparent; color:var(--ink2); font-size:1rem; line-height:1}
.blk .m{font-family:var(--f-ui); font-weight:600; white-space:nowrap}

/* ---------- Guia ---------- */
.tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px}
table.map{border-collapse:collapse; width:100%; font-size:.92rem}
table.map th, table.map td{border-bottom:1px solid var(--line); padding:9px 10px; text-align:left; vertical-align:top}
table.map th{font-family:var(--f-ui); font-weight:600; background:var(--hl2)}
.tbl-wrap{overflow-x:auto}
.phase{border-left:4px solid var(--ink); padding-left:16px; margin-bottom:26px}
.phase.now{border-left-color:var(--hl); }
.phase h2 small{font-family:var(--f-body); font-weight:400; font-size:.9rem; color:var(--ink2); display:block; margin-top:4px}
.wk{margin:12px 0; padding:12px 14px}
.chk{display:flex; gap:10px; align-items:flex-start; padding:5px 0; cursor:pointer}
.chk input{margin-top:.3em; width:18px; height:18px; accent-color:var(--ink); flex:none}
.chk.done span{color:var(--ink3); text-decoration:line-through}
.pill-now{display:inline-block; background:var(--hl); color:#1B2550; font-family:var(--f-ui); font-weight:800; font-size:.75rem; padding:.1em .6em; border-radius:99px; vertical-align:middle; margin-left:.4em}
.prose{max-width:74ch} .prose li{margin-bottom:.35em}

/* ---------- Modal e toast ---------- */
.modal-bg{position:fixed; inset:0; background:rgba(14,20,48,.45); z-index:80; display:grid; place-items:center; padding:16px}
.modal{background:var(--card); border-radius:20px; border:1.5px solid var(--line); width:min(560px,100%); max-height:88vh; overflow:auto; padding:22px; box-shadow:0 20px 50px -20px rgba(0,0,0,.5)}
.modal .top{display:flex; align-items:center; gap:10px; margin-bottom:12px}
.modal .top h2{margin:0}
.modal .close{margin-left:auto; border:0; background:transparent; font-size:1.5rem; line-height:1; color:var(--ink2)}
.sess{display:flex; gap:10px; align-items:center; padding:8px 0; border-bottom:1px dashed var(--line)}
.sess:last-child{border-bottom:0}
#toast{width:max-content; max-width:90vw; text-align:center; position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:.7em 1.2em; border-radius:999px; font-family:var(--f-ui); font-weight:600; z-index:95; opacity:0; pointer-events:none; transition:opacity .2s}
#toast.show{opacity:1}
#toast.act{pointer-events:auto; display:flex; align-items:center; gap:.8em}
#toast .undo{border:0; background:var(--hl); color:#1B2550; font-family:var(--f-ui); font-weight:800; padding:.3em .8em; border-radius:999px}
@media (max-width:860px){ #toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))} }
.photo-edit{display:flex; gap:16px; align-items:center}
.photo-edit .avatar{width:88px; height:88px; font-size:2rem}
/* ---------- Botão de tema ---------- */
.theme-btn{width:42px; height:42px; border-radius:50%; border:1.5px solid var(--line); background:var(--card); color:var(--ink); display:grid; place-items:center; flex:none; position:relative; overflow:hidden; padding:0}
.theme-btn:hover{border-color:var(--ink)}
.theme-btn svg{position:absolute; width:22px; height:22px; transition:transform .55s cubic-bezier(.45,1.6,.4,1), opacity .35s}
.theme-btn .sun{color:#E0A800}
.theme-btn .moon{color:#AFC3FF; transform:rotate(-120deg) scale(0); opacity:0}
html[data-eff="dark"] .theme-btn .sun{transform:rotate(120deg) scale(0); opacity:0}
html[data-eff="dark"] .theme-btn .moon{transform:none; opacity:1}
.brand .theme-btn{margin-left:auto; width:36px; height:36px}
.brand .theme-btn svg{width:19px; height:19px}
#themeFab{position:fixed; top:calc(12px + env(safe-area-inset-top,0px)); right:12px; z-index:45; box-shadow:var(--shadow)}
body.inapp #themeFab{display:none}

.crop-stage canvas:active{cursor:grabbing}
.zoomrow{display:flex; align-items:center; gap:10px; margin-bottom:14px}
.zoomrow input{flex:1; accent-color:var(--ink)}
@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }

let fb=null;

  uid:null,
  async init(){
    const v="10.12.2", base=`https://www.gstatic.com/firebasejs/${v}/`;
    const [appM,authM,fsM]=await Promise.all([import(base+"firebase-app.js"),import(base+"firebase-auth.js"),import(base+"firebase-firestore.js")]);
    const app=appM.initializeApp(FIREBASE_CONFIG);
    let db;
    try{db=fsM.initializeFirestore(app,{localCache:fsM.persistentLocalCache({tabManager:fsM.persistentMultipleTabManager()})})}
    catch(e){db=fsM.getFirestore(app)}
    fb={auth:authM.getAuth(app),db,A:authM,F:fsM};
  },
  currentUser(){return new Promise(res=>{const un=fb.A.onAuthStateChanged(fb.auth,u=>{un();res(u)})})},
  async login(pwd){const c=await fb.A.signInWithEmailAndPassword(fb.auth,LOGIN_EMAIL,pwd);return c.user},
  async logout(){await fb.A.signOut(fb.auth)},
  ref(...path){return fb.F.doc(fb.db,"users",DATA_ID,...path)},
  async loadUser(){const s=await fb.F.getDoc(this.ref());return s.exists()?s.data():null},
  async saveUser(data){await fb.F.setDoc(this.ref(),JSON.parse(JSON.stringify(data)))},
  async loadMonth(ym){const s=await fb.F.getDoc(this.ref("months",ym));return s.exists()?(s.data().sessions||[]):[]},
  async saveMonth(ym,sessions){await fb.F.setDoc(this.ref("months",ym),{sessions:JSON.parse(JSON.stringify(sessions))})}
};

  let n=0;const d=new Date();

function elapsedMs(r){if(!r)return 0;return (r.acc||0)+(r.startedAt?Date.now()-r.startedAt:0)}
function timerStart(subj,topic,mode){
  U.running={subj,topic:topic||"",mode:mode||0,acc:0,startedAt:Date.now(),begin:new Date().toISOString(),date:todayStr(),alerted:false};

function timerResume(){const r=U.running;if(!r||r.startedAt)return;r.startedAt=Date.now();saveUser(true);render()}
async function timerStop(){
  const r=U.running;if(!r)return;
  const sec=Math.round(elapsedMs(r)/1000);
  const note=($("#tNote")&&$("#tNote").value||"").trim();
  const date=r.date||todayStr(), sn=snap(date.slice(0,7),false);
  U.running=null;saveUser(true);
  if(sec<30){toast("Sessão muito curta — não foi registrada.");render();return}
  await addSession({id:newId(),date,begin:r.begin,sec,subj:r.subj,topic:r.topic||"",note});
  render();offerUndo(`Registrado: ${fmtHM(sec)} de ${subjById(r.subj).name}`,sn);
}
function timerDiscard(){const sn=snap(null,false);U.running=null;saveUser(true);render();offerUndo("Tempo descartado.",sn)}
function beep(){
  try{const ctx=new (window.AudioContext||window.webkitAudioContext)();[0,.35,.7].forEach(t=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=880;g.gain.setValueAtTime(.001,ctx.currentTime+t);g.gain.exponentialRampToValueAtTime(.3,ctx.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+.28);o.connect(g).connect(ctx.destination);o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+.3)})}catch(e){}
}
setInterval(()=>{
  const r=U&&U.running;if(!r)return;
  const ms=elapsedMs(r);
  const clk=$("#clock");if(clk)clk.textContent=fmtClock(ms);

    const bar=$("#tBar");if(bar)bar.style.width=Math.min(100,ms/(r.mode*60000)*100)+"%";
    if(ms>=r.mode*60000&&!r.alerted&&r.startedAt){r.alerted=true;timerPause();beep();toast(`${r.mode} minutos! Hora de uma pausa.`);
      if("Notification" in window&&Notification.permission==="granted")new Notification("Pausa!",{body:`Você completou ${r.mode} min de ${subjById(r.subj).name}.`})}

const mqDark=matchMedia("(prefers-color-scheme: dark)");
function themePref(){return (U&&U.settings.theme)||localStorage.getItem(LS+"theme")||"auto"}
function isDark(){const t=themePref();return t==="dark"||(t==="auto"&&mqDark.matches)}
function applyTheme(){
  const t=themePref(), h=document.documentElement;
  if(t==="auto")delete h.dataset.theme;else h.dataset.theme=t;
  h.dataset.eff=isDark()?"dark":"light";
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=isDark()?"#0E1430":"#F6F8FC";
}
mqDark.addEventListener("change",applyTheme);
function toggleTheme(btn){
  const next=isDark()?"light":"dark";
  const apply=()=>{localStorage.setItem(LS+"theme",next);if(U){U.settings.theme=next;saveUser();const sel=$("#sTheme");if(sel)sel.value=next}applyTheme()};
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce){apply();return}
  if(!document.startViewTransition){ // navegadores sem View Transitions: troca suave de cores
    const h=document.documentElement;h.classList.add("theming");apply();setTimeout(()=>h.classList.remove("theming"),500);return;
  }
  const r=btn.getBoundingClientRect(), x=r.left+r.width/2, y=r.top+r.height/2;
  const rad=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
  const vt=document.startViewTransition(apply);
  vt.ready.then(()=>document.documentElement.animate(
    {clipPath:[`circle(0px at ${x}px ${y}px)`,`circle(${rad}px at ${x}px ${y}px)`]},
    {duration:600,easing:"cubic-bezier(.6,0,.3,1)",pseudoElement:"::view-transition-new(root)"})).catch(()=>{});
}
document.addEventListener("click",e=>{const b=e.target.closest('[data-act="theme"]');if(b){e.stopPropagation();toggleTheme(b)}},true);

/* ---------- Início ---------- */
function viewHome(){
  const p=U.profile, name=(p.name||"").split(" ")[0]||"";
  const phrases=(p.phrases&&p.phrases.length?p.phrases:DEFAULT_PHRASES);
  if(!UI.phrase)UI.phrase=phrases[Math.floor(Math.random()*phrases.length)];
  const phrase=UI.phrase.replaceAll("{nome}",name||"você");
  const dm=dayMap(), today=todayStr(), td=dm[today]||{total:0,by:{}};
  const goal=(U.settings.goalMin||180)*60;
  const wd=new Date().getDay(), plan=U.routine[wd]||[];
  const planned={};plan.forEach(b=>planned[b.s]=(planned[b.s]||0)+b.m*60);
  const ph=currentPhase();

  // semana (seg a dom)
  const now=new Date(), monday=new Date(now);monday.setDate(now.getDate()-((now.getDay()+6)%7));
  let wkMax=1;const wkDays=[];
  for(let i=0;i<7;i++){const d=new Date(monday);d.setDate(monday.getDate()+i);const k=ymd(d);const v=dm[k]||{total:0,by:{}};wkDays.push({k,d,v});wkMax=Math.max(wkMax,v.total)}
  const wkTotal=wkDays.reduce((a,x)=>a+x.v.total,0);
  const monthKey=today.slice(0,7);
  const mTotal=(MONTHS[monthKey]||[]).reduce((a,s)=>a+s.sec,0);

  const cds=[["d",U.exams.dmae],["c",U.exams.contagem],["t",U.exams.tjsp]].map(([k,dt])=>{
    const n=daysUntil(dt);
    if(n===null)return `<span class="cd"><span>${EX_SHORT[k]}</span><span class="small muted">data a definir</span></span>`;
    if(n<0)return `<span class="cd"><span>${EX_SHORT[k]}</span><span class="small muted">prova realizada</span></span>`;
    return `<span class="cd ${n<=45?"soon":""}"><b>${n===0?"Hoje!":n}</b><span>${n===0?"":n===1?"dia":"dias"} · ${EX_SHORT[k]}</span></span>`;
  }).join("");

  return `
  <section class="hello">
    ${avatarHTML(p)}
    <div><div class="hand">${greetWord()}${name?", "+esc(name):""}!</div><div class="phrase">${esc(phrase)}</div></div>
  </section>
  <div class="countdowns">${cds}</div>
  <div class="grid g-home">
    <div class="grid" style="align-content:start">
      ${timerCard()}
      <div class="card">
        <h3>Esta semana</h3>
        <div class="stats"><div class="stat"><b>${fmtHM(wkTotal)}</b><span class="small muted">na semana</span></div>
        <div class="stat"><b>${fmtHM(mTotal)}</b><span class="small muted">em ${MONTHS_PT[new Date().getMonth()]}</span></div>
        <div class="stat"><b>${streak(dm)}</b><span class="small muted">dias seguidos</span></div></div>
        <div class="week">${wkDays.map(x=>`<div class="col" data-day="${x.k}" title="">${Object.entries(x.v.by).map(([s,sec])=>`<span style="height:${sec/wkMax*100}%;background:${subjById(s).color}"></span>`).join("")}</div>`).join("")}</div>
        <div class="week lbl" style="height:auto">${wkDays.map(x=>`<div>${WD[x.d.getDay()]}<b>${x.v.total?fmtHM(x.v.total):"–"}</b></div>`).join("")}</div>
      </div>
    </div>
    <div class="grid" style="align-content:start">
      <div class="card">
        <h3>Hoje</h3>
        <div class="row" style="align-items:baseline"><span class="stat"><b>${fmtHM(td.total)}</b></span><span class="muted small">de ${fmtHM(goal)} de meta</span></div>
        <div class="prog" style="margin:8px 0 4px"><span style="width:${Math.min(100,td.total/goal*100)}%;--c:var(--ok)"></span></div>
        ${td.total>=goal?`<p class="small" style="color:var(--ok);font-weight:700;margin-top:6px">Meta do dia cumprida! 🎉</p>`:""}
      </div>
      <div class="card">
        <h3>Rotina de ${WD_FULL[wd].toLowerCase()}</h3>
        ${plan.length?Object.entries(planned).map(([s,sec])=>{const d=td.by[s]||0,sj=subjById(s),pc=Math.min(100,d/sec*100);
          return `<div class="plan-item ${pc>=100?"done":""}"><span class="dot" style="--c:${sj.color}"></span><span class="nm">${esc(sj.name)}</span>
          <button class="btn sm ghost" data-act="quickstart" data-s="${s}" ${U.running?"disabled":""}>▶</button>
          <div class="prog"><span style="width:${pc}%;--c:${sj.color}"></span></div>
          <span class="tiny muted" style="grid-column:2/4">${fmtHM(d)} de ${fmtHM(sec)}</span></div>`}).join("")
        :`<p class="muted">Nada planejado para hoje. <a href="#rotina">Monte sua rotina</a>.</p>`}
      </div>
      <div class="card">
        <h3>Onde você está</h3>
        <p><b>${PHASES[ph-1].title}</b><br><span class="muted small">${PHASES[ph-1].range}</span></p>
        <a class="btn sm" href="#guia">Abrir o guia desta fase</a>
      </div>
    </div>
  </div>`;
}

/* ---------- Calendário ---------- */
function viewCal(){
  const dm=dayMap(), y=UI.calYear, m=UI.calMonth;
  const years=new Set([new Date().getFullYear()]);Object.keys(dm).forEach(k=>years.add(+k.slice(0,4)));
  const yTotal=Object.entries(dm).filter(([k])=>k.startsWith(y+"-")).reduce((a,[,v])=>a+v.total,0);
  const yDays=Object.entries(dm).filter(([k,v])=>k.startsWith(y+"-")&&v.total>0).length;

  // mês
  const first=new Date(y,m,1), last=new Date(y,m+1,0);
  const lead=(first.getDay()+6)%7; const today=todayStr();
  let cells="";for(let i=0;i<lead;i++)cells+=`<div class="day empty"></div>`;
  let mTotal=0,mDays=0;const mBy={};
  for(let d=1;d<=last.getDate();d++){
    const k=`${y}-${pad(m+1)}-${pad(d)}`, v=dm[k];
    if(v&&v.total){mTotal+=v.total;mDays++;for(const [s,sec] of Object.entries(v.by))mBy[s]=(mBy[s]||0)+sec}
    const stack=v&&v.total?Object.entries(v.by).sort((a,b)=>b[1]-a[1]).map(([s,sec])=>`<span style="flex:${sec};background:${subjById(s).color}"></span>`).join(""):"";
    cells+=`<button class="day ${k===today?"today":""}" data-day="${k}"><span class="n">${d}</span>${v&&v.total?`<div class="stack">${stack}</div><span class="t">${fmtHM(v.total)}</span>`:""}</button>`;
  }
  const mMax=Math.max(1,...Object.values(mBy));
  return `
  <div class="view-head"><h1>Calendário</h1><span class="spacer"></span>
    <select id="calYear" style="width:auto">${[...years].sort().map(v=>`<option ${v===y?"selected":""}>${v}</option>`).join("")}</select></div>
  <div class="card" style="margin-bottom:16px">
    <div class="row" style="margin-bottom:10px"><h3 style="margin:0">Ano de ${y}</h3><span class="muted small">${fmtHM(yTotal)} em ${yDays} ${yDays===1?"dia":"dias"}</span><span class="spacer"></span>
      <span class="legend">menos <i class="l0"></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i><i class="l5"></i> mais</span></div>
    ${heatmapHTML(y,dm)}
    <p class="tiny muted" style="margin:8px 0 0">Passe o mouse (ou toque) num quadradinho para ver as matérias do dia; clique para abrir o registro.</p>
  </div>
  <div class="grid g-2">
    <div class="card">
      <div class="row" style="margin-bottom:10px"><button class="btn sm ghost" data-act="mprev" aria-label="Mês anterior">‹</button>
      <h3 style="margin:0; text-transform:capitalize">${MONTHS_PT[m]} ${y}</h3>
      <button class="btn sm ghost" data-act="mnext" aria-label="Próximo mês">›</button></div>
      <div class="mcal">${["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"].map(d=>`<div class="hd">${d}</div>`).join("")}${cells}</div>
    </div>
    <div class="card">
      <h3>Resumo de ${MONTHS_PT[m]}</h3>
      <div class="stats" style="margin-bottom:12px"><div class="stat"><b>${fmtHM(mTotal)}</b><span class="small muted">no mês</span></div>
      <div class="stat"><b>${mDays}</b><span class="small muted">dias estudados</span></div>
      <div class="stat"><b>${mDays?fmtHM(mTotal/mDays):"–"}</b><span class="small muted">média por dia estudado</span></div></div>
      ${Object.keys(mBy).length?Object.entries(mBy).sort((a,b)=>b[1]-a[1]).map(([s,sec])=>{const sj=subjById(s);return `<div class="hbar"><span class="row" style="gap:.4em;flex-wrap:nowrap"><span class="dot" style="--c:${sj.color}"></span>${esc(sj.name)}</span><div class="prog"><span style="width:${sec/mMax*100}%;--c:${sj.color}"></span></div><span class="v">${fmtHM(sec)}</span></div>`}).join("")
        :`<p class="muted">Nenhum estudo registrado neste mês ainda. Use o cronômetro na tela Início.</p>`}
    </div>
  </div>`;
}
function heatmapHTML(year,dm){
  const start=new Date(year,0,1);start.setDate(start.getDate()-start.getDay());
  const end=new Date(year,11,31);end.setDate(end.getDate()+(6-end.getDay()));
  const today=todayStr();let cells="";const lbls=[];const d=new Date(start);
  while(d<=end){
    if(d.getDay()===0)lbls.push("");
    if(d.getDate()===1&&d.getFullYear()===year)lbls[lbls.length-1]=MONTHS_PT[d.getMonth()].slice(0,3);
    const k=ymd(d), inYear=d.getFullYear()===year, v=dm[k];
    cells+=`<div class="c ${inYear?"l"+level(v?v.total:0):"out"} ${k===today?"today":""}" ${inYear?`data-day="${k}"`:""}></div>`;
    d.setDate(d.getDate()+1);
  }
  return `<div class="heat-wrap"><div class="heat-row"><div class="heat-days"><span></span><span>seg</span><span></span><span>qua</span><span></span><span>sex</span><span></span></div>
    <div><div class="months-lbl">${lbls.map(l=>`<span>${l}</span>`).join("")}</div><div class="heat">${cells}</div></div></div></div>`;
}

/* ---------- Tooltip dos dias ---------- */
document.addEventListener("mouseover",e=>{
  const el=e.target.closest("[data-day]");const tip=$("#tip");
  if(!el||!U){tip.classList.add("hide");return}
  const k=el.dataset.day, v=dayMap()[k];
  tip.innerHTML=`<b>${fmtDateLong(k)}</b><div style="margin:4px 0 2px">${v&&v.total?"Total: <b>"+fmtHM(v.total)+"</b>":"Sem estudo registrado"}</div>`+
    (v?Object.entries(v.by).sort((a,b)=>b[1]-a[1]).map(([s,sec])=>{const sj=subjById(s);return `<div class="r"><span class="dot" style="--c:${sj.color}"></span><span>${esc(sj.name)}</span><span>${fmtHM(sec)}</span></div>`}).join(""):"");
  tip.classList.remove("hide");
  const r=el.getBoundingClientRect(), tw=tip.offsetWidth, th=tip.offsetHeight;
  let x=r.left+r.width/2-tw/2, y=r.top-th-8;
  x=Math.max(8,Math.min(x,innerWidth-tw-8)); if(y<8)y=r.bottom+8;
  tip.style.left=x+"px";tip.style.top=y+"px";
});
addEventListener("scroll",()=>$("#tip").classList.add("hide"),{passive:true});

  const v=dayMap()[k]||{total:0,by:{}};
  openModal(`<div class="top"><h2 style="font-size:1.2rem">${fmtDateLong(k)}</h2><button class="close" data-close aria-label="Fechar">×</button></div>
  <p><b style="font-family:var(--f-ui);font-size:1.4rem">${fmtHM(v.total)}</b> <span class="muted">estudados</span></p>

}

function resizeImage(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const s=240,c=document.createElement("canvas");c.width=c.height=s;const k=Math.max(s/img.width,s/img.height),w=img.width*k,h=img.height*k;c.getContext("2d").drawImage(img,(s-w)/2,(s-h)/2,w,h);URL.revokeObjectURL(img.src);res(c.toDataURL("image/jpeg",.82))};img.onerror=rej;img.src=URL.createObjectURL(file)})}
/* ---------- Recorte da foto de perfil ---------- */
function cropModal(file){
  const url=URL.createObjectURL(file), img=new Image();
  img.onerror=()=>{URL.revokeObjectURL(url);toast("Não consegui abrir essa imagem. Tente JPG, PNG ou WEBP.")};
  img.onload=()=>{
    const S=280, dpr=Math.min(3,window.devicePixelRatio||1);
    const base=Math.max(S/img.width,S/img.height); // escala mínima que cobre o quadro
    const st={z:1,ox:0,oy:0};
    openModal(`<div class="top"><h2>Ajustar foto</h2><button class="close" data-close aria-label="Fechar">×</button></div>
      <p class="small muted" style="margin-bottom:6px">Arraste para posicionar e use o controle para aproximar. O que ficar dentro do círculo vira sua foto.</p>
      <div class="crop-stage"><canvas id="cropCv" width="${S*dpr}" height="${S*dpr}" aria-label="Área de recorte"></canvas></div>
      <div class="zoomrow"><span aria-hidden="true">−</span><input type="range" id="cropZ" min="1" max="5" step="0.01" value="1" aria-label="Zoom"><span aria-hidden="true">+</span></div>
      <div class="row"><button class="btn ghost" data-act="cropreset">Centralizar</button><span class="spacer"></span><button class="btn primary" id="cropOk">Usar esta foto</button></div>`);
    const cv=$("#cropCv"), ctx=cv.getContext("2d"), zr=$("#cropZ");
    const clamp=()=>{const k=base*st.z, mx=Math.max(0,(img.width*k-S)/2), my=Math.max(0,(img.height*k-S)/2);
      st.ox=Math.max(-mx,Math.min(mx,st.ox));st.oy=Math.max(-my,Math.min(my,st.oy))};
    const paint=(c,size,overlay)=>{const f=size/S,k=base*st.z*f,w=img.width*k,h=img.height*k;
      c.fillStyle="#0E1430";c.fillRect(0,0,size,size);
      c.imageSmoothingQuality="high";c.drawImage(img,size/2+st.ox*f-w/2,size/2+st.oy*f-h/2,w,h);
      if(overlay){c.save();c.fillStyle="rgba(14,20,48,.55)";c.beginPath();c.rect(0,0,size,size);c.arc(size/2,size/2,size/2-6*f,0,Math.PI*2,true);c.fill("evenodd");
        c.strokeStyle="rgba(255,255,255,.9)";c.lineWidth=2*f;c.beginPath();c.arc(size/2,size/2,size/2-6*f,0,Math.PI*2);c.stroke();c.restore()}};
    const draw=()=>{clamp();paint(ctx,S*dpr,true)};
    draw();
    // arrastar (mouse, toque e caneta) + pinça com dois dedos
    const pts=new Map();let pinch=null;
    const scaleOf=()=>cv.getBoundingClientRect().width/S;
    cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:st.z}}});
    cv.addEventListener("pointermove",e=>{if(!pts.has(e.pointerId))return;const prev=pts.get(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(pts.size===2&&pinch){const [a,b]=[...pts.values()];st.z=Math.max(1,Math.min(5,pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d));zr.value=st.z}
      else{const sc=scaleOf();st.ox+=(e.clientX-prev.x)/sc;st.oy+=(e.clientY-prev.y)/sc}
      draw()});
    const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null};
    cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
    cv.addEventListener("wheel",e=>{e.preventDefault();st.z=Math.max(1,Math.min(5,st.z*(e.deltaY<0?1.08:1/1.08)));zr.value=st.z;draw()},{passive:false});
    zr.addEventListener("input",()=>{st.z=+zr.value;draw()});
    $("[data-act=cropreset]").addEventListener("click",e=>{e.stopPropagation();st.z=1;st.ox=0;st.oy=0;zr.value=1;draw()});
    cv.addEventListener("keydown",e=>{const step=10;if(e.key==="ArrowLeft")st.ox+=step;else if(e.key==="ArrowRight")st.ox-=step;else if(e.key==="ArrowUp")st.oy+=step;else if(e.key==="ArrowDown")st.oy-=step;else return;e.preventDefault();draw()});
    cv.tabIndex=0;
    $("#cropOk").addEventListener("click",async()=>{
      const out=document.createElement("canvas");out.width=out.height=256;paint(out.getContext("2d"),256,false);
      const sn=snap();U.profile.photo=out.toDataURL("image/jpeg",.85);URL.revokeObjectURL(url);
      cacheLockProfile();closeModal();await saveUser(true);render();offerUndo("Foto atualizada.",sn);
    });
  };
  img.src=url;
}
function cacheLockProfile(){try{localStorage.setItem(LS+"lock",JSON.stringify({name:U.profile.name,photo:U.profile.photo}))}catch(e){}}

async function ensureYear(y){
  const need=U.months.filter(ym=>ym.startsWith(y+"-")&&!MONTHS[ym]);
  await Promise.all(need.map(async ym=>{MONTHS[ym]=await Store.loadMonth(ym).catch(()=>[])}));
}
async function loadAllMonths(){await Promise.all(U.months.filter(ym=>!MONTHS[ym]).map(async ym=>{MONTHS[ym]=await Store.loadMonth(ym).catch(()=>[])}))}

/* ======================================================================
   Inicialização
   ====================================================================== */
async function openApp(){
  let data=await Store.loadUser();
  if(!data){data=defaultUser();U=data;await saveUser(true)}
  U={...defaultUser(),...data};
  U.profile={...defaultUser().profile,...(data.profile||{})};
  U.settings={...defaultUser().settings,...(data.settings||{})};
  U.exams={...defaultUser().exams,...(data.exams||{})};
  if(!U.exams.contagem)U.exams.contagem="2027-01-24";
  // carrega todos os meses registrados (1 leitura por mês)
  await loadAllMonths();
  cacheLockProfile();
  $("#lock").classList.add("hide");$("#app").classList.remove("hide");document.body.classList.add("inapp");
  UI.view=(location.hash||"#inicio").slice(1);
  render();setSync("ok");
  if(!U.profile.name)setTimeout(()=>{location.hash="#perfil";toast("Bem-vindo(a)! Coloque seu nome e uma foto.")},300);
}
function showLock(){
  const c=JSON.parse(localStorage.getItem(LS+"lock")||"null");
  if(c){ if(c.photo)$("#lockAvatar").innerHTML=`<img src="${c.photo}" alt="">`;else if(c.name)$("#lockAvatar").textContent=initials(c.name);
    if(c.name)$("#lockHello").textContent=`${greetWord()}, ${c.name.split(" ")[0]}!`; }
  else $("#lockHello").textContent=greetWord()+"!";
  $("#lockUser").value=LOGIN_EMAIL;
  $("#lock").classList.remove("hide");$("#lockPwd").focus();
}
$("#lockForm").addEventListener("submit",async e=>{
  e.preventDefault();const btn=$("#lockBtn");btn.disabled=true;$("#lockErr").textContent="";
  try{const u=await Store.login($("#lockPwd").value);$("#lockPwd").value="";Store.uid=u.uid;await openApp()}
  catch(err){console.error(err);$("#lockErr").textContent=authMsg(err)}
  finally{btn.disabled=false}
});
(async()=>{
  if(!FB_READY){showLock();$("#lockPwd").disabled=true;$("#lockBtn").disabled=true;
    $("#lockErr").textContent="O site ainda não está ligado ao Firebase. Preencha a configuração no index.html (veja o README).";return}
  try{await Store.init()}catch(e){console.error(e);showLock();$("#lockErr").textContent="Não foi possível carregar o Firebase. Verifique a configuração e a internet.";return}
  const u=await Store.currentUser();
  if(u){Store.uid=u.uid;try{await openApp()}catch(e){console.error(e);showLock();$("#lockErr").textContent="Não consegui carregar seus dados. Confira as regras do Firestore (README)."}}
  else showLock();
})();
</script>
